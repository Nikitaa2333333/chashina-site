  - generic [ref=f31e34]:
    - generic [ref=f31e35]: Подход
    - heading "Две половины одной работы." [level=2] [ref=f31e36]
    - generic [ref=f31e37]:
      - generic [ref=f31e38]:
        - generic [ref=f31e39]: 01. Снаружи
        - paragraph [ref=f31e40]: Лазеры, фокусированный ультразвук, радиоволновой лифтинг, токи. Всё, что делается с кожей и мягкими тканями непосредственно — с понятной глубиной воздействия и предсказуемым результатом.
      - generic [ref=f31e41]:
        - generic [ref=f31e42]: 02. Изнутри
        - paragraph [ref=f31e43]: Хроническое воспаление, окислительный стресс, гликация, дефициты, качество сна. Всё, из-за чего кожа стареет быстрее и хуже восстанавливается — и что не исправить ни одним аппаратом.
    - paragraph [ref=f31e44]:
      - text: Кожа — самый большой орган человека. Работая с ней, мы включаем процессы и в окружающих тканях. Поэтому для меня антивозрастная работа — работа
      - mark [ref=f31e45]: с организмом целиком
      - text: ", а не с отдельной морщиной."
  - generic [ref=f31e47]:
    - generic [ref=f31e48]: Как строится работа
    - heading "Почему я не начинаю с лифтинга." [level=2] [ref=f31e49]
  - generic [ref=f31e50]:
    - article [ref=f31e51]:
      - generic [ref=f31e52]: "01."
      - generic [ref=f31e53]:
        - heading "Разобраться" [level=3] [ref=f31e54]
        - paragraph [ref=f31e55]: "Сначала нужно понять, с чем мы имеем дело. Тип старения у всех разный, и от него напрямую зависит, что делать можно, а что бессмысленно или даже вредно. Иногда для этого достаточно осмотра, иногда я прошу сдать анализы: часть проблем с кожей решается не в кабинете косметолога."
    - article [ref=f31e56]:
      - generic [ref=f31e57]: "02."
      - generic [ref=f31e58]:
        - heading "Подготовить ткани" [level=3] [ref=f31e59]
        - paragraph [ref=f31e60]: Радиоволновой лифтинг, микротоки, процедуры с очищающим действием — они оздоравливают ткани и сосуды, выводят лишнюю жидкость, возвращают коже плотность и сияние.
    - article [ref=f31e61]:
      - generic [ref=f31e62]: "03."
      - generic [ref=f31e63]:
        - heading "Подтянуть и закрепить" [level=3] [ref=f31e64]
        - paragraph [ref=f31e65]: И только когда ткани к этому готовы, есть смысл переходить к мощному лифтингу и закреплять достигнутый результат. В обратном порядке это или не даст эффекта, или даст, но ненадолго.
  - generic [ref=f31e67]:
    - generic [ref=f31e68]: Что для меня важно
    - generic [ref=f31e69]:
      - generic [ref=f31e70]:
        - heading "Безопасность технологии" [level=3] [ref=f31e71]
        - paragraph [ref=f31e72]: И для пациента, и для врача — это не обсуждается.
      - generic [ref=f31e73]:
        - heading "Предсказуемость результата" [level=3] [ref=f31e74]
        - paragraph [ref=f31e75]: Я должна понимать, что именно получится и через какое время, и сказать это вам до начала, а не после.
      - generic [ref=f31e76]:
        - heading "Ваше участие" [level=3] [ref=f31e77]
        - paragraph [ref=f31e78]: Косметология не работает в отрыве от чекапов, сна, физической нагрузки и управления стрессом. Это не дополнение к процедурам, это их условие.
  - generic [ref=f31e80]:
    - generic [ref=f31e81]: Подход в одной фразе
    - paragraph [ref=f31e82]: "Красивая кожа — это всегда результат комплексной работы: ухода, процедур по показаниям, питания и здоровья организма в целом."
  - generic [ref=f31e84]:
    - generic [ref=f31e85]: Аппаратные методы
    - heading "Что происходит с тканями." [level=2] [ref=f31e86]
    - paragraph [ref=f31e87]: Ниже — не перечень аппаратов, а объяснение того, что каждый метод делает с кожей. Торговые названия имеет смысл обсуждать уже на консультации, когда понятна задача.
  - generic [ref=f31e92]:
    - article [ref=f31e93]:
      - generic [ref=f31e95]:
        - heading "Световые и лазерные методики" [level=3] [ref=f31e96]
        - paragraph [ref=f31e97]: "Пигмент, сосуды, качество поверхности кожи. Свет работает адресно: разрушает то, что мешает, не задевая остальное."
    - article [ref=f31e98]:
      - generic [ref=f31e100]:
        - heading "Радиоволновой лифтинг" [level=3] [ref=f31e101]
        - paragraph [ref=f31e102]: Контролируемый прогрев тканей запускает выработку коллагена — кожа постепенно возвращает плотность и тонус.
    - article [ref=f31e103]:
      - generic [ref=f31e105]:
        - heading "Токи и микротоки" [level=3] [ref=f31e106]
        - paragraph [ref=f31e107]: Дренаж, тонус, работа с отёчностью. Мягкие методики, которые готовят ткани к более мощным воздействиям.
    - article [ref=f31e108]:
      - generic [ref=f31e110]:
        - heading "Фокусированный ультразвук" [level=3] [ref=f31e111]
        - paragraph [ref=f31e112]: Работа с глубоким каркасом лица — тем слоем, до которого не достают кремы и поверхностные процедуры.
  - generic [ref=f31e114]:
    - generic [ref=f31e115]:
      - generic [ref=f31e116]: Гравитационный птоз
      - heading "Провисает не кожа — каркас, на котором она держится." [level=2] [ref=f31e117]
      - paragraph [ref=f31e118]: "С возрастом провисает не столько кожа, сколько то, на чём она держится — внутренний каркас лица. Поэтому кремы и поверхностные процедуры на овал почти не влияют: они работают выше, а проблема глубже."
      - paragraph [ref=f31e119]: Фокусированный ультразвук — способ дотянуться до этого слоя без хирургии. Что именно происходит с тканями, когда ждать результат и кому метод не подходит — разбираем на консультации.
      - link "Обсудить на консультации" [ref=f31e120] [cursor=pointer]:
        - /url: "#contact"
    - figure [ref=f31e130]
  - generic [ref=f31e133]:
    - generic [ref=f31e134]: Инъекционные методы
    - heading "Чего можно достичь." [level=2] [ref=f31e135]
    - paragraph [ref=f31e136]: Говорю не о препаратах, а о задачах. Препарат подбирается под задачу, а не наоборот.
    - generic [ref=f31e137]:
      - article [ref=f31e138]:
        - generic [ref=f31e139]: "01."
        - generic [ref=f31e140]:
          - heading "Качество и увлажнённость кожи" [level=3] [ref=f31e141]
          - paragraph [ref=f31e142]: Плотность, сияние, увлажнённость — работа с самой тканью кожи, а не с её объёмами.
      - article [ref=f31e143]:
        - generic [ref=f31e144]: "02."
        - generic [ref=f31e145]:
          - heading "Объёмы и опора тканей" [level=3] [ref=f31e146]
          - paragraph [ref=f31e147]: Восстановление опоры там, где ткани её потеряли — без попытки «слепить» новое лицо.
      - article [ref=f31e148]:
        - generic [ref=f31e149]: "03."
        - generic [ref=f31e150]:
          - heading "Мимические зоны" [level=3] [ref=f31e151]
          - paragraph [ref=f31e152]: Расслабить то, что заламывает кожу, сохранив живую мимику и естественное выражение.
      - article [ref=f31e153]:
        - generic [ref=f31e154]: "04."
        - generic [ref=f31e155]:
          - heading "Асимметрия" [level=3] [ref=f31e156]
          - paragraph [ref=f31e157]: Аккуратное выравнивание врождённых и возрастных асимметрий — работа ювелирная и очень индивидуальная.
    - paragraph [ref=f31e158]:
      - text: Инъекции не заменяют лифтинг, не меняют черты лица и не отменяют ухода —
      - mark [ref=f31e159]: это инструмент, а не волшебство
      - text: .
  - generic [ref=f31e161]:
    - generic [ref=f31e162]: Зоны, которые выдают возраст
    - heading "Лицо ещё держится, а шея выдаёт." [level=2] [ref=f31e163]
    - paragraph [ref=f31e164]: Возраст читается не по лбу и не по носогубным складкам. Первыми выдают шея, зона декольте, кисти рук — и именно им обычно достаётся меньше всего внимания.
    - generic [ref=f31e165]:
      - generic [ref=f31e166]:
        - heading "Шея и кольца Венеры" [level=3] [ref=f31e167]
        - paragraph [ref=f31e168]: Кожа здесь тоньше, сальных желёз меньше, а нагрузки от экранов — больше, поэтому шея стареет раньше лица. Что из этого генетика, а что привычки — видно на осмотре, и от этого зависит план.
      - generic [ref=f31e169]:
        - heading "Второй подбородок" [level=3] [ref=f31e170]
        - paragraph [ref=f31e171]: "Причины разные: лишний объём, слабый тонус тканей, особенности анатомии. Часть случаев решается аппаратами — и я честно говорю, где проходит граница с хирургией."
      - generic [ref=f31e172]:
        - heading "Кисти, локти, колени" [level=3] [ref=f31e173]
        - paragraph [ref=f31e174]: "Зоны, которым достаётся меньше всего ухода. Здесь работает плотность и качество кожи: уплотняющие методики и защита от солнца дают больше, чем любой крем."
  - generic [ref=f31e176]:
    - figure [ref=f31e177]
    - generic [ref=f31e179]:
      - generic [ref=f31e180]: Изнутри
      - heading "Красота начинается не с крема." [level=2] [ref=f31e181]
      - paragraph [ref=f31e182]: "Про это я много пишу у себя в канале: состояние кожи во многом определяется тем, что происходит внутри. Хроническое воспаление, окислительный стресс, состояние кишечника, дефициты, качество сна — всё это отражается на лице раньше, чем мы связываем одно с другим."
      - paragraph [ref=f31e183]: "Я не верю в одну молекулу, которая решит все проблемы. Красивая кожа — это всегда результат комплексной работы: домашнего ухода, процедур по показаниям, питания, образа жизни и здоровья организма в целом."
      - link "Читать статьи" [ref=f31e184] [cursor=pointer]:
        - /url: "#"
  - generic [ref=f31e195]:
    - generic [ref=f31e196]: Домашний уход
    - heading "Я рекомендую." [level=2] [ref=f31e197]
    - generic [ref=f31e198]:
      - generic [ref=f31e199]:
        - paragraph [ref=f31e200]: "Домашний уход иногда решает больше, чем процедуры: он работает каждый день, а не раз в месяц. Но вокруг него столько маркетинга, что разобраться самостоятельно почти невозможно."
        - paragraph [ref=f31e201]: Я подбираю уход под задачу и тип кожи, а не под обещания на упаковке. Чаще всего это марки с дерматологической школой и понятным составом — те, которыми пользуюсь сама и которые советую пациентам на приёме.
