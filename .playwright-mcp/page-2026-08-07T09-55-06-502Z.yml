  - generic [ref=f26e33]:
    - generic [ref=f26e34]: Подход
    - heading "Две половины одной работы." [level=2] [ref=f26e35]
    - generic [ref=f26e36]:
      - generic [ref=f26e37]:
        - generic [ref=f26e38]: 01. Снаружи
        - paragraph [ref=f26e39]: Лазеры, фокусированный ультразвук, радиоволновой лифтинг, токи. Всё, что делается с кожей и мягкими тканями непосредственно — с понятной глубиной воздействия и предсказуемым результатом.
      - generic [ref=f26e40]:
        - generic [ref=f26e41]: 02. Изнутри
        - paragraph [ref=f26e42]: Хроническое воспаление, окислительный стресс, гликация, дефициты, качество сна. Всё, из-за чего кожа стареет быстрее и хуже восстанавливается — и что не исправить ни одним аппаратом.
    - paragraph [ref=f26e43]:
      - text: Кожа — самый большой орган человека. Работая с ней, мы включаем процессы и в окружающих тканях. Поэтому для меня антивозрастная работа — работа
      - mark [ref=f26e44]: с организмом целиком
      - text: ", а не с отдельной морщиной."
  - generic [ref=f26e46]:
    - generic [ref=f26e47]: Как строится работа
    - heading "Почему я не начинаю с лифтинга." [level=2] [ref=f26e48]
  - generic [ref=f26e49]:
    - article [ref=f26e50]:
      - generic [ref=f26e51]: "01."
      - generic [ref=f26e52]:
        - heading "Разобраться" [level=3] [ref=f26e53]
        - paragraph [ref=f26e54]: "Сначала нужно понять, с чем мы имеем дело. Тип старения у всех разный, и от него напрямую зависит, что делать можно, а что бессмысленно или даже вредно. Иногда для этого достаточно осмотра, иногда я прошу сдать анализы: часть проблем с кожей решается не в кабинете косметолога."
    - article [ref=f26e55]:
      - generic [ref=f26e56]: "02."
      - generic [ref=f26e57]:
        - heading "Подготовить ткани" [level=3] [ref=f26e58]
        - paragraph [ref=f26e59]: Радиоволновой лифтинг, микротоки, процедуры с очищающим действием — они оздоравливают ткани и сосуды, выводят лишнюю жидкость, возвращают коже плотность и сияние.
    - article [ref=f26e60]:
      - generic [ref=f26e61]: "03."
      - generic [ref=f26e62]:
        - heading "Подтянуть и закрепить" [level=3] [ref=f26e63]
        - paragraph [ref=f26e64]: И только когда ткани к этому готовы, есть смысл переходить к мощному лифтингу и закреплять достигнутый результат. В обратном порядке это или не даст эффекта, или даст, но ненадолго.
  - generic [ref=f26e66]:
    - generic [ref=f26e67]: Что для меня важно
    - generic [ref=f26e68]:
      - generic [ref=f26e69]:
        - heading "Безопасность технологии" [level=3] [ref=f26e70]
        - paragraph [ref=f26e71]: И для пациента, и для врача — это не обсуждается.
      - generic [ref=f26e72]:
        - heading "Предсказуемость результата" [level=3] [ref=f26e73]
        - paragraph [ref=f26e74]: Я должна понимать, что именно получится и через какое время, и сказать это вам до начала, а не после.
      - generic [ref=f26e75]:
        - heading "Ваше участие" [level=3] [ref=f26e76]
        - paragraph [ref=f26e77]: Косметология не работает в отрыве от чекапов, сна, физической нагрузки и управления стрессом. Это не дополнение к процедурам, это их условие.
  - generic [ref=f26e79]:
    - generic [ref=f26e80]: Подход в одной фразе
    - paragraph [ref=f26e81]: "Красивая кожа — это всегда результат комплексной работы: ухода, процедур по показаниям, питания и здоровья организма в целом."
  - generic [ref=f26e83]:
    - generic [ref=f26e84]: Аппаратные методы
    - heading "Что происходит с тканями." [level=2] [ref=f26e85]
    - paragraph [ref=f26e86]: Ниже — не перечень аппаратов, а объяснение того, что каждый метод делает с кожей. Торговые названия имеет смысл обсуждать уже на консультации, когда понятна задача.
  - generic [ref=f26e91]:
    - article [ref=f26e92]:
      - generic [ref=f26e94]:
        - heading "Световые и лазерные методики" [level=3] [ref=f26e95]
        - paragraph [ref=f26e96]: "Пигмент, сосуды, качество поверхности кожи. Свет работает адресно: разрушает то, что мешает, не задевая остальное."
    - article [ref=f26e97]:
      - generic [ref=f26e99]:
        - heading "Радиоволновой лифтинг" [level=3] [ref=f26e100]
        - paragraph [ref=f26e101]: Контролируемый прогрев тканей запускает выработку коллагена — кожа постепенно возвращает плотность и тонус.
    - article [ref=f26e102]:
      - generic [ref=f26e104]:
        - heading "Токи и микротоки" [level=3] [ref=f26e105]
        - paragraph [ref=f26e106]: Дренаж, тонус, работа с отёчностью. Мягкие методики, которые готовят ткани к более мощным воздействиям.
    - article [ref=f26e107]:
      - generic [ref=f26e109]:
        - heading "Фокусированный ультразвук" [level=3] [ref=f26e110]
        - paragraph [ref=f26e111]: Работа с глубоким каркасом лица — тем слоем, до которого не достают кремы и поверхностные процедуры.
  - generic [ref=f26e113]:
    - generic [ref=f26e114]:
      - generic [ref=f26e115]: Гравитационный птоз
      - heading "Провисает не кожа — каркас, на котором она держится." [level=2] [ref=f26e116]
      - paragraph [ref=f26e117]: "С возрастом провисает не столько кожа, сколько то, на чём она держится — внутренний каркас лица. Поэтому кремы и поверхностные процедуры на овал почти не влияют: они работают выше, а проблема глубже."
      - paragraph [ref=f26e118]: Фокусированный ультразвук — способ дотянуться до этого слоя без хирургии. Что именно происходит с тканями, когда ждать результат и кому метод не подходит — разбираем на консультации.
      - link "Обсудить на консультации" [ref=f26e119] [cursor=pointer]:
        - /url: "#contact"
    - figure [ref=f26e129]
  - generic [ref=f26e132]:
    - generic [ref=f26e133]: Инъекционные методы
    - heading "Чего можно достичь." [level=2] [ref=f26e134]
    - paragraph [ref=f26e135]: Говорю не о препаратах, а о задачах. Препарат подбирается под задачу, а не наоборот.
    - generic [ref=f26e136]:
      - article [ref=f26e137]:
        - generic [ref=f26e138]: "01."
        - generic [ref=f26e139]:
          - heading "Качество и увлажнённость кожи" [level=3] [ref=f26e140]
          - paragraph [ref=f26e141]: Плотность, сияние, увлажнённость — работа с самой тканью кожи, а не с её объёмами.
      - article [ref=f26e142]:
        - generic [ref=f26e143]: "02."
        - generic [ref=f26e144]:
          - heading "Объёмы и опора тканей" [level=3] [ref=f26e145]
          - paragraph [ref=f26e146]: Восстановление опоры там, где ткани её потеряли — без попытки «слепить» новое лицо.
      - article [ref=f26e147]:
        - generic [ref=f26e148]: "03."
        - generic [ref=f26e149]:
          - heading "Мимические зоны" [level=3] [ref=f26e150]
          - paragraph [ref=f26e151]: Расслабить то, что заламывает кожу, сохранив живую мимику и естественное выражение.
      - article [ref=f26e152]:
        - generic [ref=f26e153]: "04."
        - generic [ref=f26e154]:
          - heading "Асимметрия" [level=3] [ref=f26e155]
          - paragraph [ref=f26e156]: Аккуратное выравнивание врождённых и возрастных асимметрий — работа ювелирная и очень индивидуальная.
    - paragraph [ref=f26e157]:
      - text: Инъекции не заменяют лифтинг, не меняют черты лица и не отменяют ухода —
      - mark [ref=f26e158]: это инструмент, а не волшебство
      - text: .
  - generic [ref=f26e160]:
    - generic [ref=f26e161]: Зоны, которые выдают возраст
    - heading "Лицо ещё держится, а шея выдаёт." [level=2] [ref=f26e162]
    - paragraph [ref=f26e163]: Возраст читается не по лбу и не по носогубным складкам. Первыми выдают шея, зона декольте, кисти рук — и именно им обычно достаётся меньше всего внимания.
    - generic [ref=f26e164]:
      - generic [ref=f26e165]:
        - heading "Шея и кольца Венеры" [level=3] [ref=f26e166]
        - paragraph [ref=f26e167]: Кожа здесь тоньше, сальных желёз меньше, а нагрузки от экранов — больше, поэтому шея стареет раньше лица. Что из этого генетика, а что привычки — видно на осмотре, и от этого зависит план.
      - generic [ref=f26e168]:
        - heading "Второй подбородок" [level=3] [ref=f26e169]
        - paragraph [ref=f26e170]: "Причины разные: лишний объём, слабый тонус тканей, особенности анатомии. Часть случаев решается аппаратами — и я честно говорю, где проходит граница с хирургией."
      - generic [ref=f26e171]:
        - heading "Кисти, локти, колени" [level=3] [ref=f26e172]
        - paragraph [ref=f26e173]: "Зоны, которым достаётся меньше всего ухода. Здесь работает плотность и качество кожи: уплотняющие методики и защита от солнца дают больше, чем любой крем."
  - generic [ref=f26e175]:
    - figure [ref=f26e176]
    - generic [ref=f26e178]:
      - generic [ref=f26e179]: Изнутри
      - heading "Красота начинается не с крема." [level=2] [ref=f26e180]
      - paragraph [ref=f26e181]: "Про это я много пишу у себя в канале: состояние кожи во многом определяется тем, что происходит внутри. Хроническое воспаление, окислительный стресс, состояние кишечника, дефициты, качество сна — всё это отражается на лице раньше, чем мы связываем одно с другим."
      - paragraph [ref=f26e182]: "Я не верю в одну молекулу, которая решит все проблемы. Красивая кожа — это всегда результат комплексной работы: домашнего ухода, процедур по показаниям, питания, образа жизни и здоровья организма в целом."
      - link "Читать статьи" [ref=f26e183] [cursor=pointer]:
        - /url: "#"
  - generic [ref=f26e194]:
    - generic [ref=f26e195]: Домашний уход
    - heading "Я рекомендую." [level=2] [ref=f26e196]
    - generic [ref=f26e197]:
      - generic [ref=f26e198]:
        - paragraph [ref=f26e199]: "Домашний уход иногда решает больше, чем процедуры: он работает каждый день, а не раз в месяц. Но вокруг него столько маркетинга, что разобраться самостоятельно почти невозможно."
