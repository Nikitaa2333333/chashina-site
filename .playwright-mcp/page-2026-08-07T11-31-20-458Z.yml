        - paragraph [ref=f17e20]: Врач-косметолог, специалист превентивной медицины. 22 года практики.
        - paragraph [ref=f17e21]: Аппарат сам по себе не решает ничего. Решает то, насколько точно понятно, что происходит с вашей кожей — и с организмом, частью которого она является.
