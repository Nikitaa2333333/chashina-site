  - generic [ref=f17e34]:
    - generic [ref=f17e35]: Подход
    - heading "Две половины одной работы." [level=2] [ref=f17e36]
    - generic [ref=f17e37]:
      - generic [ref=f17e38]:
        - generic [ref=f17e39]: 01. Снаружи
        - paragraph [ref=f17e40]: Лазеры, фокусированный ультразвук, радиоволновой лифтинг, токи. Всё, что делается с кожей и мягкими тканями непосредственно — с понятной глубиной воздействия и предсказуемым результатом.
      - generic [ref=f17e41]:
        - generic [ref=f17e42]: 02. Изнутри
        - paragraph [ref=f17e43]: Хроническое воспаление, окислительный стресс, гликация, дефициты, качество сна. Всё, из-за чего кожа стареет быстрее и хуже восстанавливается — и что не исправить ни одним аппаратом.
    - paragraph [ref=f17e44]:
      - text: Кожа — самый большой орган человека. Работая с ней, мы включаем процессы и в окружающих тканях. Поэтому для меня антивозрастная работа — работа
      - mark [ref=f17e45]: с организмом целиком
      - text: ", а не с отдельной морщиной."
  - generic [ref=f17e47]:
    - generic [ref=f17e48]: Как строится работа
    - heading "Почему я не начинаю с лифтинга." [level=2] [ref=f17e49]
  - generic [ref=f17e50]:
    - article [ref=f17e51]:
      - generic [ref=f17e52]: "01."
      - generic [ref=f17e53]:
        - heading "Разобраться" [level=3] [ref=f17e54]
        - paragraph [ref=f17e55]: "Сначала нужно понять, с чем мы имеем дело. Тип старения у всех разный, и от него напрямую зависит, что делать можно, а что бессмысленно или даже вредно. Иногда для этого достаточно осмотра, иногда я прошу сдать анализы: часть проблем с кожей решается не в кабинете косметолога."
    - article [ref=f17e56]:
      - generic [ref=f17e57]: "02."
      - generic [ref=f17e58]:
        - heading "Подготовить ткани" [level=3] [ref=f17e59]
        - paragraph [ref=f17e60]: Радиоволновой лифтинг, микротоки, процедуры с очищающим действием — они оздоравливают ткани и сосуды, выводят лишнюю жидкость, возвращают коже плотность и сияние.
    - article [ref=f17e61]:
      - generic [ref=f17e62]: "03."
      - generic [ref=f17e63]:
        - heading "Подтянуть и закрепить" [level=3] [ref=f17e64]
        - paragraph [ref=f17e65]: И только когда ткани к этому готовы, есть смысл переходить к мощному лифтингу и закреплять достигнутый результат. В обратном порядке это или не даст эффекта, или даст, но ненадолго.
  - generic [ref=f17e67]:
    - generic [ref=f17e68]: Что для меня важно
    - generic [ref=f17e69]:
      - generic [ref=f17e70]:
        - heading "Безопасность технологии" [level=3] [ref=f17e71]
        - paragraph [ref=f17e72]: И для пациента, и для врача — это не обсуждается.
      - generic [ref=f17e73]:
        - heading "Предсказуемость результата" [level=3] [ref=f17e74]
        - paragraph [ref=f17e75]: Я должна понимать, что именно получится и через какое время, и сказать это вам до начала, а не после.
      - generic [ref=f17e76]:
        - heading "Ваше участие" [level=3] [ref=f17e77]
        - paragraph [ref=f17e78]: Косметология не работает в отрыве от чекапов, сна, физической нагрузки и управления стрессом. Это не дополнение к процедурам, это их условие.
  - generic [ref=f17e80]:
    - generic [ref=f17e81]: Подход в одной фразе
    - paragraph [ref=f17e82]: "Красивая кожа — это всегда результат комплексной работы: ухода, процедур по показаниям, питания и здоровья организма в целом."
  - generic [ref=f17e84]:
    - generic [ref=f17e85]: Аппаратные методы
    - heading "Что происходит с тканями." [level=2] [ref=f17e86]
    - paragraph [ref=f17e87]: Ниже — не перечень аппаратов, а объяснение того, что каждый метод делает с кожей. Торговые названия имеет смысл обсуждать уже на консультации, когда понятна задача.
  - generic [ref=f17e92]:
    - article [ref=f17e93]:
      - generic [ref=f17e95]:
        - heading "Световые и лазерные методики" [level=3] [ref=f17e96]
        - paragraph [ref=f17e97]: "Пигмент, сосуды, качество поверхности кожи. Свет работает адресно: разрушает то, что мешает, не задевая остальное."
    - article [ref=f17e98]:
      - generic [ref=f17e100]:
        - heading "Радиоволновой лифтинг" [level=3] [ref=f17e101]
        - paragraph [ref=f17e102]: Контролируемый прогрев тканей запускает выработку коллагена — кожа постепенно возвращает плотность и тонус.
    - article [ref=f17e103]:
      - generic [ref=f17e105]:
        - heading "Токи и микротоки" [level=3] [ref=f17e106]
        - paragraph [ref=f17e107]: Дренаж, тонус, работа с отёчностью. Мягкие методики, которые готовят ткани к более мощным воздействиям.
    - article [ref=f17e108]:
      - generic [ref=f17e110]:
        - heading "Фокусированный ультразвук" [level=3] [ref=f17e111]
        - paragraph [ref=f17e112]: Работа с глубоким каркасом лица — тем слоем, до которого не достают кремы и поверхностные процедуры.
  - generic [ref=f17e114]:
    - generic [ref=f17e115]:
      - generic [ref=f17e116]: Гравитационный птоз
      - heading "Провисает не кожа — каркас, на котором она держится." [level=2] [ref=f17e117]
      - paragraph [ref=f17e118]: "С возрастом провисает не столько кожа, сколько то, на чём она держится — внутренний каркас лица. Поэтому кремы и поверхностные процедуры на овал почти не влияют: они работают выше, а проблема глубже."
      - paragraph [ref=f17e119]: Фокусированный ультразвук — способ дотянуться до этого слоя без хирургии. Что именно происходит с тканями, когда ждать результат и кому метод не подходит — разбираем на консультации.
      - link "Обсудить на консультации" [ref=f17e120] [cursor=pointer]:
        - /url: "#contact"
    - figure [ref=f17e130]
  - generic [ref=f17e133]:
    - generic [ref=f17e134]: Инъекционные методы
    - heading "Чего можно достичь." [level=2] [ref=f17e135]
    - paragraph [ref=f17e136]: Говорю не о препаратах, а о задачах. Препарат подбирается под задачу, а не наоборот.
    - figure [ref=f17e137]:
      - 'img "Инъекционная процедура: работа по разметке" [ref=f17e138]'
    - generic [ref=f17e139]:
      - article [ref=f17e140]:
        - generic [ref=f17e141]: "01."
        - generic [ref=f17e142]:
          - heading "Качество и увлажнённость кожи" [level=3] [ref=f17e143]
          - paragraph [ref=f17e144]: Плотность, сияние, увлажнённость — работа с самой тканью кожи, а не с её объёмами.
      - article [ref=f17e145]:
        - generic [ref=f17e146]: "02."
        - generic [ref=f17e147]:
          - heading "Объёмы и опора тканей" [level=3] [ref=f17e148]
          - paragraph [ref=f17e149]: Восстановление опоры там, где ткани её потеряли — без попытки «слепить» новое лицо.
      - article [ref=f17e150]:
        - generic [ref=f17e151]: "03."
        - generic [ref=f17e152]:
          - heading "Мимические зоны" [level=3] [ref=f17e153]
          - paragraph [ref=f17e154]: Расслабить то, что заламывает кожу, сохранив живую мимику и естественное выражение.
      - article [ref=f17e155]:
        - generic [ref=f17e156]: "04."
        - generic [ref=f17e157]:
          - heading "Асимметрия" [level=3] [ref=f17e158]
          - paragraph [ref=f17e159]: Аккуратное выравнивание врождённых и возрастных асимметрий — работа ювелирная и очень индивидуальная.
    - paragraph [ref=f17e160]:
      - text: Инъекции не заменяют лифтинг, не меняют черты лица и не отменяют ухода —
      - mark [ref=f17e161]: это инструмент, а не волшебство
      - text: .
  - generic [ref=f17e163]:
    - generic [ref=f17e164]: Зоны, которые выдают возраст
    - heading "Лицо ещё держится, а шея выдаёт." [level=2] [ref=f17e165]
    - paragraph [ref=f17e166]: Возраст читается не по лбу и не по носогубным складкам. Первыми выдают шея, зона декольте, кисти рук — и именно им обычно достаётся меньше всего внимания.
    - generic [ref=f17e167]:
      - generic [ref=f17e168]:
        - heading "Шея и кольца Венеры" [level=3] [ref=f17e169]
        - paragraph [ref=f17e170]: Кожа здесь тоньше, сальных желёз меньше, а нагрузки от экранов — больше, поэтому шея стареет раньше лица. Что из этого генетика, а что привычки — видно на осмотре, и от этого зависит план.
      - generic [ref=f17e171]:
        - heading "Второй подбородок" [level=3] [ref=f17e172]
        - paragraph [ref=f17e173]: "Причины разные: лишний объём, слабый тонус тканей, особенности анатомии. Часть случаев решается аппаратами — и я честно говорю, где проходит граница с хирургией."
      - generic [ref=f17e174]:
        - heading "Кисти, локти, колени" [level=3] [ref=f17e175]
        - paragraph [ref=f17e176]: "Зоны, которым достаётся меньше всего ухода. Здесь работает плотность и качество кожи: уплотняющие методики и защита от солнца дают больше, чем любой крем."
  - generic [ref=f17e178]:
    - figure [ref=f17e179]
    - generic [ref=f17e181]:
      - generic [ref=f17e182]: Изнутри
      - heading "Красота начинается не с крема." [level=2] [ref=f17e183]
      - paragraph [ref=f17e184]: "Про это я много пишу у себя в канале: состояние кожи во многом определяется тем, что происходит внутри. Хроническое воспаление, окислительный стресс, состояние кишечника, дефициты, качество сна — всё это отражается на лице раньше, чем мы связываем одно с другим."
      - paragraph [ref=f17e185]: "Я не верю в одну молекулу, которая решит все проблемы. Красивая кожа — это всегда результат комплексной работы: домашнего ухода, процедур по показаниям, питания, образа жизни и здоровья организма в целом."
      - link "Читать статьи" [ref=f17e186] [cursor=pointer]:
        - /url: "#"
  - generic [ref=f17e197]:
    - generic [ref=f17e198]: Домашний уход
    - heading "Я рекомендую." [level=2] [ref=f17e199]
    - generic [ref=f17e200]:
      - generic [ref=f17e201]:
        - paragraph [ref=f17e202]: "Домашний уход иногда решает больше, чем процедуры: он работает каждый день, а не раз в месяц. Но вокруг него столько маркетинга, что разобраться самостоятельно почти невозможно."
        - paragraph [ref=f17e203]: Я подбираю уход под задачу и тип кожи, а не под обещания на упаковке. Чаще всего это марки с дерматологической школой и понятным составом — те, которыми пользуюсь сама и которые советую пациентам на приёме.
