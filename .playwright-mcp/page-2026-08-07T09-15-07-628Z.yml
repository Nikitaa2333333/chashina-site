  - generic [ref=e138]:
    - generic [ref=e139]: Инъекционные методы
    - heading "Чего можно достичь." [level=2] [ref=e140]
    - paragraph [ref=e141]: Говорю не о препаратах, а о задачах. Препарат подбирается под задачу, а не наоборот.
    - generic [ref=e142]:
      - article [ref=e143]:
        - generic [ref=e144]: "01."
        - generic [ref=e145]:
          - heading "Качество и увлажнённость кожи" [level=3] [ref=e146]
          - paragraph [ref=e147]: Плотность, сияние, увлажнённость — работа с самой тканью кожи, а не с её объёмами.
      - article [ref=e148]:
        - generic [ref=e149]: "02."
        - generic [ref=e150]:
          - heading "Объёмы и опора тканей" [level=3] [ref=e151]
          - paragraph [ref=e152]: Восстановление опоры там, где ткани её потеряли — без попытки «слепить» новое лицо.
      - article [ref=e153]:
        - generic [ref=e154]: "03."
        - generic [ref=e155]:
          - heading "Мимические зоны" [level=3] [ref=e156]
          - paragraph [ref=e157]: Расслабить то, что заламывает кожу, сохранив живую мимику и естественное выражение.
      - article [ref=e158]:
        - generic [ref=e159]: "04."
        - generic [ref=e160]:
          - heading "Асимметрия" [level=3] [ref=e161]
          - paragraph [ref=e162]: Аккуратное выравнивание врождённых и возрастных асимметрий — работа ювелирная и очень индивидуальная.
    - paragraph [ref=e163]:
      - text: Инъекции не заменяют лифтинг, не меняют черты лица и не отменяют ухода —
      - mark [ref=e164]: это инструмент, а не волшебство
      - text: .
  - generic [ref=e166]:
    - generic [ref=e167]: Зоны, которые выдают возраст
    - heading "Лицо ещё держится, а шея выдаёт." [level=2] [ref=e168]
    - paragraph [ref=e169]: Возраст читается не по лбу и не по носогубным складкам. Первыми выдают шея, зона декольте, кисти рук — и именно им обычно достаётся меньше всего внимания.
    - generic [ref=e170]:
      - generic [ref=e171]:
        - heading "Шея и кольца Венеры" [level=3] [ref=e172]
        - paragraph [ref=e173]: Кожа здесь тоньше, сальных желёз меньше, а нагрузки от экранов — больше, поэтому шея стареет раньше лица. Что из этого генетика, а что привычки — видно на осмотре, и от этого зависит план.
      - generic [ref=e174]:
        - heading "Второй подбородок" [level=3] [ref=e175]
        - paragraph [ref=e176]: "Причины разные: лишний объём, слабый тонус тканей, особенности анатомии. Часть случаев решается аппаратами — и я честно говорю, где проходит граница с хирургией."
      - generic [ref=e177]:
        - heading "Кисти, локти, колени" [level=3] [ref=e178]
        - paragraph [ref=e179]: "Зоны, которым достаётся меньше всего ухода. Здесь работает плотность и качество кожи: уплотняющие методики и защита от солнца дают больше, чем любой крем."
  - generic [ref=e181]:
    - figure [ref=e182]
    - generic [ref=e184]:
      - generic [ref=e185]: Изнутри
      - heading "Красота начинается не с крема." [level=2] [ref=e186]
      - paragraph [ref=e187]: "Про это я много пишу у себя в канале: состояние кожи во многом определяется тем, что происходит внутри. Хроническое воспаление, окислительный стресс, состояние кишечника, дефициты, качество сна — всё это отражается на лице раньше, чем мы связываем одно с другим."
      - paragraph [ref=e188]: "Я не верю в одну молекулу, которая решит все проблемы. Красивая кожа — это всегда результат комплексной работы: домашнего ухода, процедур по показаниям, питания, образа жизни и здоровья организма в целом."
