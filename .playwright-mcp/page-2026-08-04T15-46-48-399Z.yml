      - generic [ref=f2e17]:
        - paragraph [ref=f2e18]: Врач-косметолог, специалист превентивной медицины. 22 года практики.
        - paragraph [ref=f2e19]: Аппарат сам по себе не решает ничего. Решает то, насколько точно понятно, что происходит с вашей кожей — и с организмом, частью которого она является.
