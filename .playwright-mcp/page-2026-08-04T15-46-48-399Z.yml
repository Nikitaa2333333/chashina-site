  - generic [ref=f2e33]:
    - generic [ref=f2e34]: Подход
    - heading "Две половины одной работы." [level=2] [ref=f2e35]
    - generic [ref=f2e36]:
      - generic [ref=f2e37]:
        - generic [ref=f2e38]: 01. Снаружи
        - paragraph [ref=f2e39]: Лазеры, фокусированный ультразвук, радиоволновой лифтинг, токи. Всё, что делается с кожей и мягкими тканями непосредственно — с понятной глубиной воздействия и предсказуемым результатом.
      - generic [ref=f2e40]:
        - generic [ref=f2e41]: 02. Изнутри
        - paragraph [ref=f2e42]: Хроническое воспаление, окислительный стресс, гликация, дефициты, качество сна. Всё, из-за чего кожа стареет быстрее и хуже восстанавливается — и что не исправить ни одним аппаратом.
    - generic [ref=f2e43]:
      - generic [ref=f2e44]: Два механизма, о которых редко говорят
      - generic [ref=f2e45]:
        - generic [ref=f2e46]:
          - heading "Инфламэйджинг" [level=3] [ref=f2e47]
          - paragraph [ref=f2e48]: Старение через хроническое воспаление. Оно может быть незаметным, но при этом годами поддерживать высыпания, замедлять восстановление и разрушать коллаген.
        - generic [ref=f2e49]:
          - heading "Гликация" [level=3] [ref=f2e50]
          - paragraph [ref=f2e51]: Повреждение белков избытком сахара. Именно из-за неё коллаген теряет эластичность, а кожа — упругость, независимо от того, что вы наносите сверху.
    - paragraph [ref=f2e52]:
      - text: Кожа — самый большой орган человека. Работая с ней, мы включаем процессы и в окружающих тканях. Поэтому для меня антивозрастная работа — работа
      - mark [ref=f2e53]: с организмом целиком
      - text: ", а не с отдельной морщиной."
  - generic [ref=f2e55]:
    - generic [ref=f2e56]: Как строится работа
    - heading "Почему я не начинаю с лифтинга." [level=2] [ref=f2e57]
  - generic [ref=f2e58]:
    - article [ref=f2e59]:
      - generic [ref=f2e60]: "01."
      - generic [ref=f2e61]:
        - heading "Разобраться" [level=3] [ref=f2e62]
        - paragraph [ref=f2e63]: "Сначала нужно понять, с чем мы имеем дело. Тип старения у всех разный, и от него напрямую зависит, что делать можно, а что бессмысленно или даже вредно. Иногда для этого достаточно осмотра, иногда я прошу сдать анализы: часть проблем с кожей решается не в кабинете косметолога."
    - article [ref=f2e64]:
      - generic [ref=f2e65]: "02."
      - generic [ref=f2e66]:
        - heading "Подготовить ткани" [level=3] [ref=f2e67]
        - paragraph [ref=f2e68]: Радиоволновой лифтинг, микротоки, процедуры с очищающим действием — они оздоравливают ткани и сосуды, выводят лишнюю жидкость, возвращают коже плотность и сияние.
    - article [ref=f2e69]:
      - generic [ref=f2e70]: "03."
      - generic [ref=f2e71]:
        - heading "Подтянуть и закрепить" [level=3] [ref=f2e72]
        - paragraph [ref=f2e73]: И только когда ткани к этому готовы, есть смысл переходить к мощному лифтингу и закреплять достигнутый результат. В обратном порядке это или не даст эффекта, или даст, но ненадолго.
  - generic [ref=f2e75]:
    - generic [ref=f2e76]: Что для меня важно
    - generic [ref=f2e77]:
      - generic [ref=f2e78]:
        - heading "Безопасность технологии" [level=3] [ref=f2e79]
        - paragraph [ref=f2e80]: И для пациента, и для врача — это не обсуждается.
      - generic [ref=f2e81]:
        - heading "Предсказуемость результата" [level=3] [ref=f2e82]
        - paragraph [ref=f2e83]: Я должна понимать, что именно получится и через какое время, и сказать это вам до начала, а не после.
      - generic [ref=f2e84]:
        - heading "Ваше участие" [level=3] [ref=f2e85]
        - paragraph [ref=f2e86]: Косметология не работает в отрыве от чекапов, сна, физической нагрузки и управления стрессом. Это не дополнение к процедурам, это их условие.
