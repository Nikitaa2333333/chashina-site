  - generic [ref=f30e34]:
    - generic [ref=f30e35]: Подход
    - heading "Две половины одной работы." [level=2] [ref=f30e36]
    - generic [ref=f30e37]:
      - generic [ref=f30e38]:
        - generic [ref=f30e39]: 01. Снаружи
        - paragraph [ref=f30e40]: Лазеры, фокусированный ультразвук, радиоволновой лифтинг, токи. Всё, что делается с кожей и мягкими тканями непосредственно — с понятной глубиной воздействия и предсказуемым результатом.
      - generic [ref=f30e41]:
        - generic [ref=f30e42]: 02. Изнутри
        - paragraph [ref=f30e43]: Хроническое воспаление, окислительный стресс, гликация, дефициты, качество сна. Всё, из-за чего кожа стареет быстрее и хуже восстанавливается — и что не исправить ни одним аппаратом.
    - paragraph [ref=f30e44]:
      - text: Кожа — самый большой орган человека. Работая с ней, мы включаем процессы и в окружающих тканях. Поэтому для меня антивозрастная работа — работа
      - mark [ref=f30e45]: с организмом целиком
      - text: ", а не с отдельной морщиной."
  - generic [ref=f30e47]:
    - generic [ref=f30e48]: Как строится работа
    - heading "Почему я не начинаю с лифтинга." [level=2] [ref=f30e49]
  - generic [ref=f30e50]:
    - article [ref=f30e51]:
      - generic [ref=f30e52]: "01."
      - generic [ref=f30e53]:
        - heading "Разобраться" [level=3] [ref=f30e54]
        - paragraph [ref=f30e55]: "Сначала нужно понять, с чем мы имеем дело. Тип старения у всех разный, и от него напрямую зависит, что делать можно, а что бессмысленно или даже вредно. Иногда для этого достаточно осмотра, иногда я прошу сдать анализы: часть проблем с кожей решается не в кабинете косметолога."
    - article [ref=f30e56]:
      - generic [ref=f30e57]: "02."
      - generic [ref=f30e58]:
        - heading "Подготовить ткани" [level=3] [ref=f30e59]
        - paragraph [ref=f30e60]: Радиоволновой лифтинг, микротоки, процедуры с очищающим действием — они оздоравливают ткани и сосуды, выводят лишнюю жидкость, возвращают коже плотность и сияние.
    - article [ref=f30e61]:
      - generic [ref=f30e62]: "03."
      - generic [ref=f30e63]:
        - heading "Подтянуть и закрепить" [level=3] [ref=f30e64]
        - paragraph [ref=f30e65]: И только когда ткани к этому готовы, есть смысл переходить к мощному лифтингу и закреплять достигнутый результат. В обратном порядке это или не даст эффекта, или даст, но ненадолго.
  - generic [ref=f30e67]:
    - generic [ref=f30e68]: Что для меня важно
    - generic [ref=f30e69]:
      - generic [ref=f30e70]:
        - heading "Безопасность технологии" [level=3] [ref=f30e71]
        - paragraph [ref=f30e72]: И для пациента, и для врача — это не обсуждается.
      - generic [ref=f30e73]:
        - heading "Предсказуемость результата" [level=3] [ref=f30e74]
        - paragraph [ref=f30e75]: Я должна понимать, что именно получится и через какое время, и сказать это вам до начала, а не после.
      - generic [ref=f30e76]:
        - heading "Ваше участие" [level=3] [ref=f30e77]
        - paragraph [ref=f30e78]: Косметология не работает в отрыве от чекапов, сна, физической нагрузки и управления стрессом. Это не дополнение к процедурам, это их условие.
  - generic [ref=f30e80]:
    - generic [ref=f30e81]: Подход в одной фразе
    - paragraph [ref=f30e82]: "Красивая кожа — это всегда результат комплексной работы: ухода, процедур по показаниям, питания и здоровья организма в целом."
  - generic [ref=f30e84]:
    - generic [ref=f30e85]: Аппаратные методы
    - heading "Что происходит с тканями." [level=2] [ref=f30e86]
    - paragraph [ref=f30e87]: Ниже — не перечень аппаратов, а объяснение того, что каждый метод делает с кожей. Торговые названия имеет смысл обсуждать уже на консультации, когда понятна задача.
  - generic [ref=f30e92]:
    - article [ref=f30e93]:
      - generic [ref=f30e95]:
        - heading "Световые и лазерные методики" [level=3] [ref=f30e96]
        - paragraph [ref=f30e97]: "Пигмент, сосуды, качество поверхности кожи. Свет работает адресно: разрушает то, что мешает, не задевая остальное."
    - article [ref=f30e98]:
      - generic [ref=f30e100]:
        - heading "Радиоволновой лифтинг" [level=3] [ref=f30e101]
        - paragraph [ref=f30e102]: Контролируемый прогрев тканей запускает выработку коллагена — кожа постепенно возвращает плотность и тонус.
    - article [ref=f30e103]:
      - generic [ref=f30e105]:
        - heading "Токи и микротоки" [level=3] [ref=f30e106]
        - paragraph [ref=f30e107]: Дренаж, тонус, работа с отёчностью. Мягкие методики, которые готовят ткани к более мощным воздействиям.
    - article [ref=f30e108]:
      - generic [ref=f30e110]:
        - heading "Фокусированный ультразвук" [level=3] [ref=f30e111]
        - paragraph [ref=f30e112]: Работа с глубоким каркасом лица — тем слоем, до которого не достают кремы и поверхностные процедуры.
  - generic [ref=f30e114]:
    - generic [ref=f30e115]:
      - generic [ref=f30e116]: Гравитационный птоз
      - heading "Провисает не кожа — каркас, на котором она держится." [level=2] [ref=f30e117]
      - paragraph [ref=f30e118]: "С возрастом провисает не столько кожа, сколько то, на чём она держится — внутренний каркас лица. Поэтому кремы и поверхностные процедуры на овал почти не влияют: они работают выше, а проблема глубже."
      - paragraph [ref=f30e119]: Фокусированный ультразвук — способ дотянуться до этого слоя без хирургии. Что именно происходит с тканями, когда ждать результат и кому метод не подходит — разбираем на консультации.
      - link "Обсудить на консультации" [ref=f30e120] [cursor=pointer]:
        - /url: "#contact"
    - figure [ref=f30e130]
  - generic [ref=f30e133]:
    - generic [ref=f30e134]: Инъекционные методы
    - heading "Чего можно достичь." [level=2] [ref=f30e135]
    - paragraph [ref=f30e136]: Говорю не о препаратах, а о задачах. Препарат подбирается под задачу, а не наоборот.
    - generic [ref=f30e137]:
      - article [ref=f30e138]:
        - generic [ref=f30e139]: "01."
        - generic [ref=f30e140]:
          - heading "Качество и увлажнённость кожи" [level=3] [ref=f30e141]
          - paragraph [ref=f30e142]: Плотность, сияние, увлажнённость — работа с самой тканью кожи, а не с её объёмами.
      - article [ref=f30e143]:
        - generic [ref=f30e144]: "02."
        - generic [ref=f30e145]:
          - heading "Объёмы и опора тканей" [level=3] [ref=f30e146]
          - paragraph [ref=f30e147]: Восстановление опоры там, где ткани её потеряли — без попытки «слепить» новое лицо.
      - article [ref=f30e148]:
        - generic [ref=f30e149]: "03."
        - generic [ref=f30e150]:
          - heading "Мимические зоны" [level=3] [ref=f30e151]
          - paragraph [ref=f30e152]: Расслабить то, что заламывает кожу, сохранив живую мимику и естественное выражение.
      - article [ref=f30e153]:
        - generic [ref=f30e154]: "04."
        - generic [ref=f30e155]:
          - heading "Асимметрия" [level=3] [ref=f30e156]
          - paragraph [ref=f30e157]: Аккуратное выравнивание врождённых и возрастных асимметрий — работа ювелирная и очень индивидуальная.
    - paragraph [ref=f30e158]:
      - text: Инъекции не заменяют лифтинг, не меняют черты лица и не отменяют ухода —
      - mark [ref=f30e159]: это инструмент, а не волшебство
      - text: .
  - generic [ref=f30e161]:
    - generic [ref=f30e162]: Зоны, которые выдают возраст
    - heading "Лицо ещё держится, а шея выдаёт." [level=2] [ref=f30e163]
    - paragraph [ref=f30e164]: Возраст читается не по лбу и не по носогубным складкам. Первыми выдают шея, зона декольте, кисти рук — и именно им обычно достаётся меньше всего внимания.
    - generic [ref=f30e165]:
      - generic [ref=f30e166]:
        - heading "Шея и кольца Венеры" [level=3] [ref=f30e167]
        - paragraph [ref=f30e168]: Кожа здесь тоньше, сальных желёз меньше, а нагрузки от экранов — больше, поэтому шея стареет раньше лица. Что из этого генетика, а что привычки — видно на осмотре, и от этого зависит план.
      - generic [ref=f30e169]:
        - heading "Второй подбородок" [level=3] [ref=f30e170]
        - paragraph [ref=f30e171]: "Причины разные: лишний объём, слабый тонус тканей, особенности анатомии. Часть случаев решается аппаратами — и я честно говорю, где проходит граница с хирургией."
      - generic [ref=f30e172]:
        - heading "Кисти, локти, колени" [level=3] [ref=f30e173]
        - paragraph [ref=f30e174]: "Зоны, которым достаётся меньше всего ухода. Здесь работает плотность и качество кожи: уплотняющие методики и защита от солнца дают больше, чем любой крем."
  - generic [ref=f30e176]:
    - figure [ref=f30e177]
    - generic [ref=f30e179]:
      - generic [ref=f30e180]: Изнутри
      - heading "Красота начинается не с крема." [level=2] [ref=f30e181]
      - paragraph [ref=f30e182]: "Про это я много пишу у себя в канале: состояние кожи во многом определяется тем, что происходит внутри. Хроническое воспаление, окислительный стресс, состояние кишечника, дефициты, качество сна — всё это отражается на лице раньше, чем мы связываем одно с другим."
      - paragraph [ref=f30e183]: "Я не верю в одну молекулу, которая решит все проблемы. Красивая кожа — это всегда результат комплексной работы: домашнего ухода, процедур по показаниям, питания, образа жизни и здоровья организма в целом."
      - link "Читать статьи" [ref=f30e184] [cursor=pointer]:
        - /url: "#"
  - generic [ref=f30e195]:
    - generic [ref=f30e196]: Домашний уход
    - heading "Я рекомендую." [level=2] [ref=f30e197]
    - generic [ref=f30e198]:
      - generic [ref=f30e199]:
        - paragraph [ref=f30e200]: "Домашний уход иногда решает больше, чем процедуры: он работает каждый день, а не раз в месяц. Но вокруг него столько маркетинга, что разобраться самостоятельно почти невозможно."
        - paragraph [ref=f30e201]: Я подбираю уход под задачу и тип кожи, а не под обещания на упаковке. Чаще всего это марки с дерматологической школой и понятным составом — те, которыми пользуюсь сама и которые советую пациентам на приёме.
