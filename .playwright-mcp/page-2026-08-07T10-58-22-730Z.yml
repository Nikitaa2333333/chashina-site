  - generic [ref=e161]:
    - generic [ref=e162]: Зоны, которые выдают возраст
    - heading "Лицо ещё держится, а шея выдаёт." [level=2] [ref=e163]
    - paragraph [ref=e164]: Возраст читается не по лбу и не по носогубным складкам. Первыми выдают шея, зона декольте, кисти рук — и именно им обычно достаётся меньше всего внимания.
    - generic [ref=e165]:
      - generic [ref=e166]:
        - heading "Шея и кольца Венеры" [level=3] [ref=e167]
        - paragraph [ref=e168]: Кожа здесь тоньше, сальных желёз меньше, а нагрузки от экранов — больше, поэтому шея стареет раньше лица. Что из этого генетика, а что привычки — видно на осмотре, и от этого зависит план.
      - generic [ref=e169]:
        - heading "Второй подбородок" [level=3] [ref=e170]
        - paragraph [ref=e171]: "Причины разные: лишний объём, слабый тонус тканей, особенности анатомии. Часть случаев решается аппаратами — и я честно говорю, где проходит граница с хирургией."
      - generic [ref=e172]:
        - heading "Кисти, локти, колени" [level=3] [ref=e173]
        - paragraph [ref=e174]: "Зоны, которым достаётся меньше всего ухода. Здесь работает плотность и качество кожи: уплотняющие методики и защита от солнца дают больше, чем любой крем."
  - generic [ref=e176]:
    - figure [ref=e177]
    - generic [ref=e179]:
      - generic [ref=e180]: Изнутри
      - heading "Красота начинается не с крема." [level=2] [ref=e181]
      - paragraph [ref=e182]: "Про это я много пишу у себя в канале: состояние кожи во многом определяется тем, что происходит внутри. Хроническое воспаление, окислительный стресс, состояние кишечника, дефициты, качество сна — всё это отражается на лице раньше, чем мы связываем одно с другим."
      - paragraph [ref=e183]: "Я не верю в одну молекулу, которая решит все проблемы. Красивая кожа — это всегда результат комплексной работы: домашнего ухода, процедур по показаниям, питания, образа жизни и здоровья организма в целом."
