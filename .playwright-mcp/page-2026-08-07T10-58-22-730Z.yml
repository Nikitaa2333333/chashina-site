  - generic [ref=e34]:
    - generic [ref=e35]: Подход
    - heading "Две половины одной работы." [level=2] [ref=e36]
    - generic [ref=e37]:
      - generic [ref=e38]:
        - generic [ref=e39]: 01. Снаружи
        - paragraph [ref=e40]: Лазеры, фокусированный ультразвук, радиоволновой лифтинг, токи. Всё, что делается с кожей и мягкими тканями непосредственно — с понятной глубиной воздействия и предсказуемым результатом.
      - generic [ref=e41]:
        - generic [ref=e42]: 02. Изнутри
        - paragraph [ref=e43]: Хроническое воспаление, окислительный стресс, гликация, дефициты, качество сна. Всё, из-за чего кожа стареет быстрее и хуже восстанавливается — и что не исправить ни одним аппаратом.
    - paragraph [ref=e44]:
      - text: Кожа — самый большой орган человека. Работая с ней, мы включаем процессы и в окружающих тканях. Поэтому для меня антивозрастная работа — работа
      - mark [ref=e45]: с организмом целиком
      - text: ", а не с отдельной морщиной."
  - generic [ref=e47]:
    - generic [ref=e48]: Как строится работа
    - heading "Почему я не начинаю с лифтинга." [level=2] [ref=e49]
  - generic [ref=e50]:
    - article [ref=e51]:
      - generic [ref=e52]: "01."
      - generic [ref=e53]:
        - heading "Разобраться" [level=3] [ref=e54]
        - paragraph [ref=e55]: "Сначала нужно понять, с чем мы имеем дело. Тип старения у всех разный, и от него напрямую зависит, что делать можно, а что бессмысленно или даже вредно. Иногда для этого достаточно осмотра, иногда я прошу сдать анализы: часть проблем с кожей решается не в кабинете косметолога."
    - article [ref=e56]:
      - generic [ref=e57]: "02."
      - generic [ref=e58]:
        - heading "Подготовить ткани" [level=3] [ref=e59]
        - paragraph [ref=e60]: Радиоволновой лифтинг, микротоки, процедуры с очищающим действием — они оздоравливают ткани и сосуды, выводят лишнюю жидкость, возвращают коже плотность и сияние.
    - article [ref=e61]:
      - generic [ref=e62]: "03."
      - generic [ref=e63]:
        - heading "Подтянуть и закрепить" [level=3] [ref=e64]
        - paragraph [ref=e65]: И только когда ткани к этому готовы, есть смысл переходить к мощному лифтингу и закреплять достигнутый результат. В обратном порядке это или не даст эффекта, или даст, но ненадолго.
  - generic [ref=e67]:
    - generic [ref=e68]: Что для меня важно
    - generic [ref=e69]:
      - generic [ref=e70]:
        - heading "Безопасность технологии" [level=3] [ref=e71]
        - paragraph [ref=e72]: И для пациента, и для врача — это не обсуждается.
      - generic [ref=e73]:
        - heading "Предсказуемость результата" [level=3] [ref=e74]
        - paragraph [ref=e75]: Я должна понимать, что именно получится и через какое время, и сказать это вам до начала, а не после.
      - generic [ref=e76]:
        - heading "Ваше участие" [level=3] [ref=e77]
        - paragraph [ref=e78]: Косметология не работает в отрыве от чекапов, сна, физической нагрузки и управления стрессом. Это не дополнение к процедурам, это их условие.
  - generic [ref=e80]:
    - generic [ref=e81]: Подход в одной фразе
    - paragraph [ref=e82]: "Красивая кожа — это всегда результат комплексной работы: ухода, процедур по показаниям, питания и здоровья организма в целом."
  - generic [ref=e84]:
    - generic [ref=e85]: Аппаратные методы
    - heading "Что происходит с тканями." [level=2] [ref=e86]
    - paragraph [ref=e87]: Ниже — не перечень аппаратов, а объяснение того, что каждый метод делает с кожей. Торговые названия имеет смысл обсуждать уже на консультации, когда понятна задача.
  - generic [ref=e92]:
    - article [ref=e93]:
      - generic [ref=e95]:
        - heading "Световые и лазерные методики" [level=3] [ref=e96]
        - paragraph [ref=e97]: "Пигмент, сосуды, качество поверхности кожи. Свет работает адресно: разрушает то, что мешает, не задевая остальное."
    - article [ref=e98]:
      - generic [ref=e100]:
        - heading "Радиоволновой лифтинг" [level=3] [ref=e101]
        - paragraph [ref=e102]: Контролируемый прогрев тканей запускает выработку коллагена — кожа постепенно возвращает плотность и тонус.
    - article [ref=e103]:
      - generic [ref=e105]:
        - heading "Токи и микротоки" [level=3] [ref=e106]
        - paragraph [ref=e107]: Дренаж, тонус, работа с отёчностью. Мягкие методики, которые готовят ткани к более мощным воздействиям.
    - article [ref=e108]:
      - generic [ref=e110]:
        - heading "Фокусированный ультразвук" [level=3] [ref=e111]
        - paragraph [ref=e112]: Работа с глубоким каркасом лица — тем слоем, до которого не достают кремы и поверхностные процедуры.
  - generic [ref=e114]:
    - generic [ref=e115]:
      - generic [ref=e116]: Гравитационный птоз
      - heading "Провисает не кожа — каркас, на котором она держится." [level=2] [ref=e117]
      - paragraph [ref=e118]: "С возрастом провисает не столько кожа, сколько то, на чём она держится — внутренний каркас лица. Поэтому кремы и поверхностные процедуры на овал почти не влияют: они работают выше, а проблема глубже."
      - paragraph [ref=e119]: Фокусированный ультразвук — способ дотянуться до этого слоя без хирургии. Что именно происходит с тканями, когда ждать результат и кому метод не подходит — разбираем на консультации.
