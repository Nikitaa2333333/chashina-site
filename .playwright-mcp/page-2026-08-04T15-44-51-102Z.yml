  - generic [ref=e33]:
    - generic [ref=e34]: Подход
    - heading "Две половины одной работы." [level=2] [ref=e35]
    - generic [ref=e36]:
      - generic [ref=e37]:
        - generic [ref=e38]: 01. Снаружи
        - paragraph [ref=e39]: Лазеры, фокусированный ультразвук, радиоволновой лифтинг, токи. Всё, что делается с кожей и мягкими тканями непосредственно — с понятной глубиной воздействия и предсказуемым результатом.
      - generic [ref=e40]:
        - generic [ref=e41]: 02. Изнутри
        - paragraph [ref=e42]: Хроническое воспаление, окислительный стресс, гликация, дефициты, качество сна. Всё, из-за чего кожа стареет быстрее и хуже восстанавливается — и что не исправить ни одним аппаратом.
    - generic [ref=e43]:
      - generic [ref=e44]: Два механизма, о которых редко говорят
      - generic [ref=e45]:
        - generic [ref=e46]:
          - heading "Инфламэйджинг" [level=3] [ref=e47]
          - paragraph [ref=e48]: Старение через хроническое воспаление. Оно может быть незаметным, но при этом годами поддерживать высыпания, замедлять восстановление и разрушать коллаген.
        - generic [ref=e49]:
          - heading "Гликация" [level=3] [ref=e50]
          - paragraph [ref=e51]: Повреждение белков избытком сахара. Именно из-за неё коллаген теряет эластичность, а кожа — упругость, независимо от того, что вы наносите сверху.
    - paragraph [ref=e52]:
      - text: Кожа — самый большой орган человека. Работая с ней, мы включаем процессы и в окружающих тканях. Поэтому для меня антивозрастная работа — работа
      - mark [ref=e53]: с организмом целиком
      - text: ", а не с отдельной морщиной."
  - generic [ref=e55]:
    - generic [ref=e56]: Как строится работа
    - heading "Почему я не начинаю с лифтинга." [level=2] [ref=e57]
  - generic [ref=e58]:
    - article [ref=e59]:
      - generic [ref=e60]: "01."
      - generic [ref=e61]:
        - heading "Разобраться" [level=3] [ref=e62]
        - paragraph [ref=e63]: "Сначала нужно понять, с чем мы имеем дело. Тип старения у всех разный, и от него напрямую зависит, что делать можно, а что бессмысленно или даже вредно. Иногда для этого достаточно осмотра, иногда я прошу сдать анализы: часть проблем с кожей решается не в кабинете косметолога."
    - article [ref=e64]:
      - generic [ref=e65]: "02."
      - generic [ref=e66]:
        - heading "Подготовить ткани" [level=3] [ref=e67]
        - paragraph [ref=e68]: Радиоволновой лифтинг, микротоки, процедуры с очищающим действием — они оздоравливают ткани и сосуды, выводят лишнюю жидкость, возвращают коже плотность и сияние.
    - article [ref=e69]:
      - generic [ref=e70]: "03."
      - generic [ref=e71]:
        - heading "Подтянуть и закрепить" [level=3] [ref=e72]
        - paragraph [ref=e73]: И только когда ткани к этому готовы, есть смысл переходить к мощному лифтингу и закреплять достигнутый результат. В обратном порядке это или не даст эффекта, или даст, но ненадолго.
  - generic [ref=e75]:
    - generic [ref=e76]: Что для меня важно
    - generic [ref=e77]:
      - generic [ref=e78]:
        - heading "Безопасность технологии" [level=3] [ref=e79]
        - paragraph [ref=e80]: И для пациента, и для врача — это не обсуждается.
      - generic [ref=e81]:
        - heading "Предсказуемость результата" [level=3] [ref=e82]
        - paragraph [ref=e83]: Я должна понимать, что именно получится и через какое время, и сказать это вам до начала, а не после.
      - generic [ref=e84]:
        - heading "Ваше участие" [level=3] [ref=e85]
        - paragraph [ref=e86]: Косметология не работает в отрыве от чекапов, сна, физической нагрузки и управления стрессом. Это не дополнение к процедурам, это их условие.
