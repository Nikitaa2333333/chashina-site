  - generic [ref=f22e86]:
    - article [ref=f22e87]:
      - generic [ref=f22e89]:
        - heading "Световые и лазерные методики" [level=3] [ref=f22e90]
        - paragraph [ref=f22e91]: "Пигмент, сосуды, качество поверхности кожи. Свет работает адресно: разрушает то, что мешает, не задевая остальное."
