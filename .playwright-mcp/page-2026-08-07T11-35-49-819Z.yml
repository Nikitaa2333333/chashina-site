  - generic [ref=f22e27]:
    - generic [ref=f22e28]: Подход
    - heading "Две половины одной работы." [level=2] [ref=f22e29]
    - generic [ref=f22e30]:
      - generic [ref=f22e31]:
        - generic [ref=f22e32]: 01. Снаружи
        - paragraph [ref=f22e33]: Лазеры, фокусированный ультразвук, радиоволновой лифтинг, токи. Всё, что делается с кожей и мягкими тканями непосредственно — с понятной глубиной воздействия и предсказуемым результатом.
      - generic [ref=f22e34]:
        - generic [ref=f22e35]: 02. Изнутри
        - paragraph [ref=f22e36]: Хроническое воспаление, окислительный стресс, гликация, дефициты, качество сна. Всё, из-за чего кожа стареет быстрее и хуже восстанавливается — и что не исправить ни одним аппаратом.
    - paragraph [ref=f22e37]:
      - text: Кожа — самый большой орган человека. Работая с ней, мы включаем процессы и в окружающих тканях. Поэтому для меня антивозрастная работа — работа
      - mark [ref=f22e38]: с организмом целиком
      - text: ", а не с отдельной морщиной."
  - generic [ref=f22e40]:
    - generic [ref=f22e41]: Как строится работа
    - heading "Почему я не начинаю с лифтинга." [level=2] [ref=f22e42]
  - generic [ref=f22e43]:
    - article [ref=f22e44]:
      - generic [ref=f22e45]: "01."
      - generic [ref=f22e46]:
        - heading "Разобраться" [level=3] [ref=f22e47]
        - paragraph [ref=f22e48]: "Сначала нужно понять, с чем мы имеем дело. Тип старения у всех разный, и от него напрямую зависит, что делать можно, а что бессмысленно или даже вредно. Иногда для этого достаточно осмотра, иногда я прошу сдать анализы: часть проблем с кожей решается не в кабинете косметолога."
    - article [ref=f22e49]:
      - generic [ref=f22e50]: "02."
      - generic [ref=f22e51]:
        - heading "Подготовить ткани" [level=3] [ref=f22e52]
        - paragraph [ref=f22e53]: Радиоволновой лифтинг, микротоки, процедуры с очищающим действием — они оздоравливают ткани и сосуды, выводят лишнюю жидкость, возвращают коже плотность и сияние.
    - article [ref=f22e54]:
      - generic [ref=f22e55]: "03."
      - generic [ref=f22e56]:
        - heading "Подтянуть и закрепить" [level=3] [ref=f22e57]
        - paragraph [ref=f22e58]: И только когда ткани к этому готовы, есть смысл переходить к мощному лифтингу и закреплять достигнутый результат. В обратном порядке это или не даст эффекта, или даст, но ненадолго.
  - generic [ref=f22e60]:
    - generic [ref=f22e61]: Принципы
    - heading "Что для меня важно." [level=2] [ref=f22e62]
    - generic [ref=f22e63]:
      - generic [ref=f22e64]:
        - heading "Безопасность технологии" [level=3] [ref=f22e65]
        - paragraph [ref=f22e66]: И для пациента, и для врача — это не обсуждается.
      - generic [ref=f22e67]:
        - heading "Предсказуемость результата" [level=3] [ref=f22e68]
        - paragraph [ref=f22e69]: Я должна понимать, что именно получится и через какое время, и сказать это вам до начала, а не после.
      - generic [ref=f22e70]:
        - heading "Ваше участие" [level=3] [ref=f22e71]
        - paragraph [ref=f22e72]: Косметология не работает в отрыве от чекапов, сна, физической нагрузки и управления стрессом. Это не дополнение к процедурам, это их условие.
  - generic [ref=f22e74]:
    - generic [ref=f22e75]: Подход в одной фразе
    - paragraph [ref=f22e76]: "Красивая кожа — это всегда результат комплексной работы: ухода, процедур по показаниям, питания и здоровья организма в целом."
  - generic [ref=f22e78]:
