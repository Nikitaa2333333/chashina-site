    - heading "Лицо ещё держится, а шея выдаёт." [level=2] [ref=f22e159]
    - paragraph [ref=f22e160]: Возраст читается не по лбу и не по носогубным складкам. Первыми выдают шея, зона декольте, кисти рук — и именно им обычно достаётся меньше всего внимания.
