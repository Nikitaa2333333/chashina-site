  - generic [ref=f28e33]:
    - generic [ref=f28e34]: Подход
    - heading "Две половины одной работы." [level=2] [ref=f28e35]
    - generic [ref=f28e36]:
      - generic [ref=f28e37]:
        - generic [ref=f28e38]: 01. Снаружи
        - paragraph [ref=f28e39]: Лазеры, фокусированный ультразвук, радиоволновой лифтинг, токи. Всё, что делается с кожей и мягкими тканями непосредственно — с понятной глубиной воздействия и предсказуемым результатом.
      - generic [ref=f28e40]:
        - generic [ref=f28e41]: 02. Изнутри
        - paragraph [ref=f28e42]: Хроническое воспаление, окислительный стресс, гликация, дефициты, качество сна. Всё, из-за чего кожа стареет быстрее и хуже восстанавливается — и что не исправить ни одним аппаратом.
    - paragraph [ref=f28e43]:
      - text: Кожа — самый большой орган человека. Работая с ней, мы включаем процессы и в окружающих тканях. Поэтому для меня антивозрастная работа — работа
      - mark [ref=f28e44]: с организмом целиком
      - text: ", а не с отдельной морщиной."
  - generic [ref=f28e46]:
    - generic [ref=f28e47]: Как строится работа
    - heading "Почему я не начинаю с лифтинга." [level=2] [ref=f28e48]
  - generic [ref=f28e49]:
    - article [ref=f28e50]:
      - generic [ref=f28e51]: "01."
      - generic [ref=f28e52]:
        - heading "Разобраться" [level=3] [ref=f28e53]
        - paragraph [ref=f28e54]: "Сначала нужно понять, с чем мы имеем дело. Тип старения у всех разный, и от него напрямую зависит, что делать можно, а что бессмысленно или даже вредно. Иногда для этого достаточно осмотра, иногда я прошу сдать анализы: часть проблем с кожей решается не в кабинете косметолога."
    - article [ref=f28e55]:
      - generic [ref=f28e56]: "02."
      - generic [ref=f28e57]:
        - heading "Подготовить ткани" [level=3] [ref=f28e58]
        - paragraph [ref=f28e59]: Радиоволновой лифтинг, микротоки, процедуры с очищающим действием — они оздоравливают ткани и сосуды, выводят лишнюю жидкость, возвращают коже плотность и сияние.
    - article [ref=f28e60]:
      - generic [ref=f28e61]: "03."
      - generic [ref=f28e62]:
        - heading "Подтянуть и закрепить" [level=3] [ref=f28e63]
        - paragraph [ref=f28e64]: И только когда ткани к этому готовы, есть смысл переходить к мощному лифтингу и закреплять достигнутый результат. В обратном порядке это или не даст эффекта, или даст, но ненадолго.
  - generic [ref=f28e66]:
    - generic [ref=f28e67]: Что для меня важно
    - generic [ref=f28e68]:
      - generic [ref=f28e69]:
        - heading "Безопасность технологии" [level=3] [ref=f28e70]
        - paragraph [ref=f28e71]: И для пациента, и для врача — это не обсуждается.
      - generic [ref=f28e72]:
        - heading "Предсказуемость результата" [level=3] [ref=f28e73]
        - paragraph [ref=f28e74]: Я должна понимать, что именно получится и через какое время, и сказать это вам до начала, а не после.
      - generic [ref=f28e75]:
        - heading "Ваше участие" [level=3] [ref=f28e76]
        - paragraph [ref=f28e77]: Косметология не работает в отрыве от чекапов, сна, физической нагрузки и управления стрессом. Это не дополнение к процедурам, это их условие.
  - generic [ref=f28e79]:
    - generic [ref=f28e80]: Подход в одной фразе
    - paragraph [ref=f28e81]: "Красивая кожа — это всегда результат комплексной работы: ухода, процедур по показаниям, питания и здоровья организма в целом."
  - generic [ref=f28e83]:
    - generic [ref=f28e84]: Аппаратные методы
    - heading "Что происходит с тканями." [level=2] [ref=f28e85]
    - paragraph [ref=f28e86]: Ниже — не перечень аппаратов, а объяснение того, что каждый метод делает с кожей. Торговые названия имеет смысл обсуждать уже на консультации, когда понятна задача.
  - generic [ref=f28e91]:
    - article [ref=f28e92]:
      - generic [ref=f28e94]:
        - heading "Световые и лазерные методики" [level=3] [ref=f28e95]
        - paragraph [ref=f28e96]: "Пигмент, сосуды, качество поверхности кожи. Свет работает адресно: разрушает то, что мешает, не задевая остальное."
    - article [ref=f28e97]:
      - generic [ref=f28e99]:
        - heading "Радиоволновой лифтинг" [level=3] [ref=f28e100]
        - paragraph [ref=f28e101]: Контролируемый прогрев тканей запускает выработку коллагена — кожа постепенно возвращает плотность и тонус.
    - article [ref=f28e102]:
      - generic [ref=f28e104]:
        - heading "Токи и микротоки" [level=3] [ref=f28e105]
        - paragraph [ref=f28e106]: Дренаж, тонус, работа с отёчностью. Мягкие методики, которые готовят ткани к более мощным воздействиям.
    - article [ref=f28e107]:
      - generic [ref=f28e109]:
        - heading "Фокусированный ультразвук" [level=3] [ref=f28e110]
        - paragraph [ref=f28e111]: Работа с глубоким каркасом лица — тем слоем, до которого не достают кремы и поверхностные процедуры.
  - generic [ref=f28e113]:
    - generic [ref=f28e114]:
      - generic [ref=f28e115]: Гравитационный птоз
      - heading "Провисает не кожа — каркас, на котором она держится." [level=2] [ref=f28e116]
      - paragraph [ref=f28e117]: "С возрастом провисает не столько кожа, сколько то, на чём она держится — внутренний каркас лица. Поэтому кремы и поверхностные процедуры на овал почти не влияют: они работают выше, а проблема глубже."
      - paragraph [ref=f28e118]: Фокусированный ультразвук — способ дотянуться до этого слоя без хирургии. Что именно происходит с тканями, когда ждать результат и кому метод не подходит — разбираем на консультации.
      - link "Обсудить на консультации" [ref=f28e119] [cursor=pointer]:
        - /url: "#contact"
    - figure [ref=f28e129]
  - generic [ref=f28e132]:
    - generic [ref=f28e133]: Инъекционные методы
    - heading "Чего можно достичь." [level=2] [ref=f28e134]
    - paragraph [ref=f28e135]: Говорю не о препаратах, а о задачах. Препарат подбирается под задачу, а не наоборот.
    - generic [ref=f28e136]:
      - article [ref=f28e137]:
        - generic [ref=f28e138]: "01."
        - generic [ref=f28e139]:
          - heading "Качество и увлажнённость кожи" [level=3] [ref=f28e140]
          - paragraph [ref=f28e141]: Плотность, сияние, увлажнённость — работа с самой тканью кожи, а не с её объёмами.
      - article [ref=f28e142]:
        - generic [ref=f28e143]: "02."
        - generic [ref=f28e144]:
          - heading "Объёмы и опора тканей" [level=3] [ref=f28e145]
          - paragraph [ref=f28e146]: Восстановление опоры там, где ткани её потеряли — без попытки «слепить» новое лицо.
      - article [ref=f28e147]:
        - generic [ref=f28e148]: "03."
        - generic [ref=f28e149]:
          - heading "Мимические зоны" [level=3] [ref=f28e150]
          - paragraph [ref=f28e151]: Расслабить то, что заламывает кожу, сохранив живую мимику и естественное выражение.
      - article [ref=f28e152]:
        - generic [ref=f28e153]: "04."
        - generic [ref=f28e154]:
          - heading "Асимметрия" [level=3] [ref=f28e155]
          - paragraph [ref=f28e156]: Аккуратное выравнивание врождённых и возрастных асимметрий — работа ювелирная и очень индивидуальная.
    - paragraph [ref=f28e157]:
      - text: Инъекции не заменяют лифтинг, не меняют черты лица и не отменяют ухода —
      - mark [ref=f28e158]: это инструмент, а не волшебство
      - text: .
  - generic [ref=f28e160]:
    - generic [ref=f28e161]: Зоны, которые выдают возраст
    - heading "Лицо ещё держится, а шея выдаёт." [level=2] [ref=f28e162]
    - paragraph [ref=f28e163]: Возраст читается не по лбу и не по носогубным складкам. Первыми выдают шея, зона декольте, кисти рук — и именно им обычно достаётся меньше всего внимания.
    - generic [ref=f28e164]:
      - generic [ref=f28e165]:
        - heading "Шея и кольца Венеры" [level=3] [ref=f28e166]
        - paragraph [ref=f28e167]: Кожа здесь тоньше, сальных желёз меньше, а нагрузки от экранов — больше, поэтому шея стареет раньше лица. Что из этого генетика, а что привычки — видно на осмотре, и от этого зависит план.
      - generic [ref=f28e168]:
        - heading "Второй подбородок" [level=3] [ref=f28e169]
        - paragraph [ref=f28e170]: "Причины разные: лишний объём, слабый тонус тканей, особенности анатомии. Часть случаев решается аппаратами — и я честно говорю, где проходит граница с хирургией."
      - generic [ref=f28e171]:
        - heading "Кисти, локти, колени" [level=3] [ref=f28e172]
        - paragraph [ref=f28e173]: "Зоны, которым достаётся меньше всего ухода. Здесь работает плотность и качество кожи: уплотняющие методики и защита от солнца дают больше, чем любой крем."
  - generic [ref=f28e175]:
    - figure [ref=f28e176]
    - generic [ref=f28e178]:
      - generic [ref=f28e179]: Изнутри
      - heading "Красота начинается не с крема." [level=2] [ref=f28e180]
      - paragraph [ref=f28e181]: "Про это я много пишу у себя в канале: состояние кожи во многом определяется тем, что происходит внутри. Хроническое воспаление, окислительный стресс, состояние кишечника, дефициты, качество сна — всё это отражается на лице раньше, чем мы связываем одно с другим."
      - paragraph [ref=f28e182]: "Я не верю в одну молекулу, которая решит все проблемы. Красивая кожа — это всегда результат комплексной работы: домашнего ухода, процедур по показаниям, питания, образа жизни и здоровья организма в целом."
      - link "Читать статьи" [ref=f28e183] [cursor=pointer]:
        - /url: "#"
  - generic [ref=f28e194]:
    - generic [ref=f28e195]: Домашний уход
    - heading "Я рекомендую." [level=2] [ref=f28e196]
    - generic [ref=f28e197]:
      - generic [ref=f28e198]:
        - paragraph [ref=f28e199]: "Домашний уход иногда решает больше, чем процедуры: он работает каждый день, а не раз в месяц. Но вокруг него столько маркетинга, что разобраться самостоятельно почти невозможно."
        - paragraph [ref=f28e200]: Я подбираю уход под задачу и тип кожи, а не под обещания на упаковке. Чаще всего это марки с дерматологической школой и понятным составом — те, которыми пользуюсь сама и которые советую пациентам на приёме.
