        - generic [ref=f5e32]: Консультация — 60 минут
  - generic [ref=f5e34]:
    - generic [ref=f5e35]: Подход
    - heading "Две половины одной работы." [level=2] [ref=f5e36]
    - generic [ref=f5e37]:
      - generic [ref=f5e38]:
        - generic [ref=f5e39]: 01. Снаружи
        - paragraph [ref=f5e40]: Лазеры, фокусированный ультразвук, радиоволновой лифтинг, токи. Всё, что делается с кожей и мягкими тканями непосредственно — с понятной глубиной воздействия и предсказуемым результатом.
      - generic [ref=f5e41]:
        - generic [ref=f5e42]: 02. Изнутри
        - paragraph [ref=f5e43]: Хроническое воспаление, окислительный стресс, гликация, дефициты, качество сна. Всё, из-за чего кожа стареет быстрее и хуже восстанавливается — и что не исправить ни одним аппаратом.
    - paragraph [ref=f5e44]:
      - text: Кожа — самый большой орган человека. Работая с ней, мы включаем процессы и в окружающих тканях. Поэтому для меня антивозрастная работа — работа
      - mark [ref=f5e45]: с организмом целиком
      - text: ", а не с отдельной морщиной."
  - generic [ref=f5e47]:
    - generic [ref=f5e48]: Как строится работа
    - heading "Почему я не начинаю с лифтинга." [level=2] [ref=f5e49]
  - generic [ref=f5e50]:
    - article [ref=f5e51]:
      - generic [ref=f5e52]: "01."
      - generic [ref=f5e53]:
        - heading "Разобраться" [level=3] [ref=f5e54]
        - paragraph [ref=f5e55]: "Сначала нужно понять, с чем мы имеем дело. Тип старения у всех разный, и от него напрямую зависит, что делать можно, а что бессмысленно или даже вредно. Иногда для этого достаточно осмотра, иногда я прошу сдать анализы: часть проблем с кожей решается не в кабинете косметолога."
    - article [ref=f5e56]:
      - generic [ref=f5e57]: "02."
      - generic [ref=f5e58]:
        - heading "Подготовить ткани" [level=3] [ref=f5e59]
        - paragraph [ref=f5e60]: Радиоволновой лифтинг, микротоки, процедуры с очищающим действием — они оздоравливают ткани и сосуды, выводят лишнюю жидкость, возвращают коже плотность и сияние.
    - article [ref=f5e61]:
      - generic [ref=f5e62]: "03."
      - generic [ref=f5e63]:
        - heading "Подтянуть и закрепить" [level=3] [ref=f5e64]
        - paragraph [ref=f5e65]: И только когда ткани к этому готовы, есть смысл переходить к мощному лифтингу и закреплять достигнутый результат. В обратном порядке это или не даст эффекта, или даст, но ненадолго.
  - generic [ref=f5e67]:
    - generic [ref=f5e68]: Что для меня важно
    - generic [ref=f5e69]:
      - generic [ref=f5e70]:
        - heading "Безопасность технологии" [level=3] [ref=f5e71]
        - paragraph [ref=f5e72]: И для пациента, и для врача — это не обсуждается.
      - generic [ref=f5e73]:
        - heading "Предсказуемость результата" [level=3] [ref=f5e74]
        - paragraph [ref=f5e75]: Я должна понимать, что именно получится и через какое время, и сказать это вам до начала, а не после.
      - generic [ref=f5e76]:
        - heading "Ваше участие" [level=3] [ref=f5e77]
        - paragraph [ref=f5e78]: Косметология не работает в отрыве от чекапов, сна, физической нагрузки и управления стрессом. Это не дополнение к процедурам, это их условие.
  - generic [ref=f5e80]:
    - generic [ref=f5e81]: Подход в одной фразе
    - paragraph [ref=f5e82]: "Красивая кожа — это всегда результат комплексной работы: ухода, процедур по показаниям, питания и здоровья организма в целом."
  - generic [ref=f5e84]:
    - generic [ref=f5e85]: Аппаратные методы
    - heading "Что происходит с тканями." [level=2] [ref=f5e86]
    - paragraph [ref=f5e87]: Ниже — не перечень аппаратов, а объяснение того, что каждый метод делает с кожей. Торговые названия имеет смысл обсуждать уже на консультации, когда понятна задача.
  - generic [ref=f5e92]:
    - article [ref=f5e93]:
      - generic [ref=f5e95]:
        - heading "Световые и лазерные методики" [level=3] [ref=f5e96]
        - paragraph [ref=f5e97]: "Пигмент, сосуды, качество поверхности кожи. Свет работает адресно: разрушает то, что мешает, не задевая остальное."
    - article [ref=f5e98]:
      - generic [ref=f5e100]:
        - heading "Радиоволновой лифтинг" [level=3] [ref=f5e101]
        - paragraph [ref=f5e102]: Контролируемый прогрев тканей запускает выработку коллагена — кожа постепенно возвращает плотность и тонус.
    - article [ref=f5e103]:
      - generic [ref=f5e105]:
        - heading "Токи и микротоки" [level=3] [ref=f5e106]
        - paragraph [ref=f5e107]: Дренаж, тонус, работа с отёчностью. Мягкие методики, которые готовят ткани к более мощным воздействиям.
    - article [ref=f5e108]:
      - generic [ref=f5e110]:
        - heading "Фокусированный ультразвук" [level=3] [ref=f5e111]
        - paragraph [ref=f5e112]: Работа с глубоким каркасом лица — тем слоем, до которого не достают кремы и поверхностные процедуры.
  - generic [ref=f5e115]:
    - generic [ref=f5e116]: Чего я больше не делаю
    - paragraph [ref=f5e117]: Косметология меняется быстро, и часть процедур, популярных десять лет назад, сегодня либо неэффективна, либо вытеснена более безопасными методами. Я о них рассказываю честно — в том числе о тех, что мне самой когда-то нравились.
  - generic [ref=f5e119]:
    - generic [ref=f5e120]:
      - generic [ref=f5e121]: Гравитационный птоз
      - heading "Провисает не кожа — каркас, на котором она держится." [level=2] [ref=f5e122]
      - paragraph [ref=f5e123]: "С возрастом провисает не столько кожа, сколько то, на чём она держится — внутренний каркас лица. Поэтому кремы и поверхностные процедуры на овал почти не влияют: они работают выше, а проблема глубже."
      - paragraph [ref=f5e124]: Фокусированный ультразвук — способ дотянуться до этого слоя без хирургии. Что именно происходит с тканями, когда ждать результат и кому метод не подходит — разбираем на консультации.
      - link "Обсудить на консультации" [ref=f5e125] [cursor=pointer]:
        - /url: "#contact"
    - figure [ref=f5e135]
  - generic [ref=f5e138]:
    - generic [ref=f5e139]: Инъекционные методы
    - heading "Чего можно достичь." [level=2] [ref=f5e140]
    - paragraph [ref=f5e141]: Говорю не о препаратах, а о задачах. Препарат подбирается под задачу, а не наоборот.
    - generic [ref=f5e142]:
      - article [ref=f5e143]:
        - generic [ref=f5e144]: "01."
        - generic [ref=f5e145]:
          - heading "Качество и увлажнённость кожи" [level=3] [ref=f5e146]
          - paragraph [ref=f5e147]: Плотность, сияние, увлажнённость — работа с самой тканью кожи, а не с её объёмами.
      - article [ref=f5e148]:
        - generic [ref=f5e149]: "02."
        - generic [ref=f5e150]:
          - heading "Объёмы и опора тканей" [level=3] [ref=f5e151]
          - paragraph [ref=f5e152]: Восстановление опоры там, где ткани её потеряли — без попытки «слепить» новое лицо.
      - article [ref=f5e153]:
        - generic [ref=f5e154]: "03."
        - generic [ref=f5e155]:
          - heading "Мимические зоны" [level=3] [ref=f5e156]
          - paragraph [ref=f5e157]: Расслабить то, что заламывает кожу, сохранив живую мимику и естественное выражение.
      - article [ref=f5e158]:
        - generic [ref=f5e159]: "04."
        - generic [ref=f5e160]:
          - heading "Асимметрия" [level=3] [ref=f5e161]
          - paragraph [ref=f5e162]: Аккуратное выравнивание врождённых и возрастных асимметрий — работа ювелирная и очень индивидуальная.
    - paragraph [ref=f5e163]:
      - text: Инъекции не заменяют лифтинг, не меняют черты лица и не отменяют ухода —
      - mark [ref=f5e164]: это инструмент, а не волшебство
      - text: .
  - generic [ref=f5e166]:
    - generic [ref=f5e167]: Зоны, которые выдают возраст
    - heading "Лицо ещё держится, а шея выдаёт." [level=2] [ref=f5e168]
    - paragraph [ref=f5e169]: Возраст читается не по лбу и не по носогубным складкам. Первыми выдают шея, зона декольте, кисти рук — и именно им обычно достаётся меньше всего внимания.
    - generic [ref=f5e170]:
      - generic [ref=f5e171]:
        - heading "Шея и кольца Венеры" [level=3] [ref=f5e172]
        - paragraph [ref=f5e173]: Кожа здесь тоньше, сальных желёз меньше, а нагрузки от экранов — больше, поэтому шея стареет раньше лица. Что из этого генетика, а что привычки — видно на осмотре, и от этого зависит план.
      - generic [ref=f5e174]:
        - heading "Второй подбородок" [level=3] [ref=f5e175]
        - paragraph [ref=f5e176]: "Причины разные: лишний объём, слабый тонус тканей, особенности анатомии. Часть случаев решается аппаратами — и я честно говорю, где проходит граница с хирургией."
      - generic [ref=f5e177]:
        - heading "Кисти, локти, колени" [level=3] [ref=f5e178]
        - paragraph [ref=f5e179]: "Зоны, которым достаётся меньше всего ухода. Здесь работает плотность и качество кожи: уплотняющие методики и защита от солнца дают больше, чем любой крем."
  - generic [ref=f5e181]:
    - figure [ref=f5e182]
    - generic [ref=f5e184]:
      - generic [ref=f5e185]: Изнутри
      - heading "Красота начинается не с крема." [level=2] [ref=f5e186]
      - paragraph [ref=f5e187]: "Про это я много пишу у себя в канале: состояние кожи во многом определяется тем, что происходит внутри. Хроническое воспаление, окислительный стресс, состояние кишечника, дефициты, качество сна — всё это отражается на лице раньше, чем мы связываем одно с другим."
      - paragraph [ref=f5e188]: "Я не верю в одну молекулу, которая решит все проблемы. Красивая кожа — это всегда результат комплексной работы: домашнего ухода, процедур по показаниям, питания, образа жизни и здоровья организма в целом."
      - link "Читать статьи" [ref=f5e189] [cursor=pointer]:
        - /url: "#"
  - generic [ref=f5e200]:
    - generic [ref=f5e201]: Домашний уход
    - heading "Я рекомендую." [level=2] [ref=f5e202]
    - generic [ref=f5e203]:
      - generic [ref=f5e204]:
        - paragraph [ref=f5e205]: "Домашний уход иногда решает больше, чем процедуры: он работает каждый день, а не раз в месяц. Но вокруг него столько маркетинга, что разобраться самостоятельно почти невозможно."
        - paragraph [ref=f5e206]: Я подбираю уход под задачу и тип кожи, а не под обещания на упаковке. Чаще всего это марки с дерматологической школой и понятным составом — те, которыми пользуюсь сама и которые советую пациентам на приёме.
