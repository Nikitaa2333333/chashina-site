  - generic [ref=f1e34]:
    - generic [ref=f1e35]: Подход
    - heading "Две половины одной работы." [level=2] [ref=f1e36]
    - generic [ref=f1e37]:
      - generic [ref=f1e38]:
        - generic [ref=f1e39]: 01. Снаружи
        - paragraph [ref=f1e40]: Лазеры, фокусированный ультразвук, радиоволновой лифтинг, токи. Всё, что делается с кожей и мягкими тканями непосредственно — с понятной глубиной воздействия и предсказуемым результатом.
      - generic [ref=f1e41]:
        - generic [ref=f1e42]: 02. Изнутри
        - paragraph [ref=f1e43]: Хроническое воспаление, окислительный стресс, гликация, дефициты, качество сна. Всё, из-за чего кожа стареет быстрее и хуже восстанавливается — и что не исправить ни одним аппаратом.
    - paragraph [ref=f1e44]:
      - text: Кожа — самый большой орган человека. Работая с ней, мы включаем процессы и в окружающих тканях. Поэтому для меня антивозрастная работа — работа
      - mark [ref=f1e45]: с организмом целиком
      - text: ", а не с отдельной морщиной."
  - generic [ref=f1e47]:
    - generic [ref=f1e48]: Как строится работа
    - heading "Почему я не начинаю с лифтинга." [level=2] [ref=f1e49]
  - generic [ref=f1e50]:
    - article [ref=f1e51]:
      - generic [ref=f1e52]: "01."
      - generic [ref=f1e53]:
        - heading "Разобраться" [level=3] [ref=f1e54]
        - paragraph [ref=f1e55]: "Сначала нужно понять, с чем мы имеем дело. Тип старения у всех разный, и от него напрямую зависит, что делать можно, а что бессмысленно или даже вредно. Иногда для этого достаточно осмотра, иногда я прошу сдать анализы: часть проблем с кожей решается не в кабинете косметолога."
    - article [ref=f1e56]:
      - generic [ref=f1e57]: "02."
      - generic [ref=f1e58]:
        - heading "Подготовить ткани" [level=3] [ref=f1e59]
        - paragraph [ref=f1e60]: Радиоволновой лифтинг, микротоки, процедуры с очищающим действием — они оздоравливают ткани и сосуды, выводят лишнюю жидкость, возвращают коже плотность и сияние.
    - article [ref=f1e61]:
      - generic [ref=f1e62]: "03."
      - generic [ref=f1e63]:
        - heading "Подтянуть и закрепить" [level=3] [ref=f1e64]
        - paragraph [ref=f1e65]: И только когда ткани к этому готовы, есть смысл переходить к мощному лифтингу и закреплять достигнутый результат. В обратном порядке это или не даст эффекта, или даст, но ненадолго.
  - generic [ref=f1e67]:
    - generic [ref=f1e68]: Что для меня важно
    - generic [ref=f1e69]:
      - generic [ref=f1e70]:
        - heading "Безопасность технологии" [level=3] [ref=f1e71]
        - paragraph [ref=f1e72]: И для пациента, и для врача — это не обсуждается.
      - generic [ref=f1e73]:
        - heading "Предсказуемость результата" [level=3] [ref=f1e74]
        - paragraph [ref=f1e75]: Я должна понимать, что именно получится и через какое время, и сказать это вам до начала, а не после.
      - generic [ref=f1e76]:
        - heading "Ваше участие" [level=3] [ref=f1e77]
        - paragraph [ref=f1e78]: Косметология не работает в отрыве от чекапов, сна, физической нагрузки и управления стрессом. Это не дополнение к процедурам, это их условие.
  - generic [ref=f1e80]:
    - generic [ref=f1e81]: Подход в одной фразе
    - paragraph [ref=f1e82]: "Красивая кожа — это всегда результат комплексной работы: ухода, процедур по показаниям, питания и здоровья организма в целом."
  - generic [ref=f1e84]:
    - generic [ref=f1e85]: Аппаратные методы
    - heading "Что происходит с тканями." [level=2] [ref=f1e86]
    - paragraph [ref=f1e87]: Ниже — не перечень аппаратов, а объяснение того, что каждый метод делает с кожей. Торговые названия имеет смысл обсуждать уже на консультации, когда понятна задача.
  - generic [ref=f1e92]:
    - article [ref=f1e93]:
      - generic [ref=f1e95]:
        - heading "Световые и лазерные методики" [level=3] [ref=f1e96]
        - paragraph [ref=f1e97]: "Пигмент, сосуды, качество поверхности кожи. Свет работает адресно: разрушает то, что мешает, не задевая остальное."
    - article [ref=f1e98]:
      - generic [ref=f1e100]:
        - heading "Радиоволновой лифтинг" [level=3] [ref=f1e101]
        - paragraph [ref=f1e102]: Контролируемый прогрев тканей запускает выработку коллагена — кожа постепенно возвращает плотность и тонус.
    - article [ref=f1e103]:
      - generic [ref=f1e105]:
        - heading "Токи и микротоки" [level=3] [ref=f1e106]
        - paragraph [ref=f1e107]: Дренаж, тонус, работа с отёчностью. Мягкие методики, которые готовят ткани к более мощным воздействиям.
    - article [ref=f1e108]:
      - generic [ref=f1e110]:
        - heading "Фокусированный ультразвук" [level=3] [ref=f1e111]
        - paragraph [ref=f1e112]: Работа с глубоким каркасом лица — тем слоем, до которого не достают кремы и поверхностные процедуры.
  - generic [ref=f1e115]:
    - generic [ref=f1e116]: Чего я больше не делаю
    - paragraph [ref=f1e117]: Косметология меняется быстро, и часть процедур, популярных десять лет назад, сегодня либо неэффективна, либо вытеснена более безопасными методами. Я о них рассказываю честно — в том числе о тех, что мне самой когда-то нравились.
  - generic [ref=f1e119]:
    - generic [ref=f1e120]:
      - generic [ref=f1e121]: Гравитационный птоз
      - heading "Провисает не кожа — каркас, на котором она держится." [level=2] [ref=f1e122]
      - paragraph [ref=f1e123]: "С возрастом провисает не столько кожа, сколько то, на чём она держится — внутренний каркас лица. Поэтому кремы и поверхностные процедуры на овал почти не влияют: они работают выше, а проблема глубже."
      - paragraph [ref=f1e124]: Фокусированный ультразвук — способ дотянуться до этого слоя без хирургии. Что именно происходит с тканями, когда ждать результат и кому метод не подходит — разбираем на консультации.
      - link "Обсудить на консультации" [ref=f1e125] [cursor=pointer]:
        - /url: "#contact"
    - figure [ref=f1e135]
  - generic [ref=f1e138]:
    - generic [ref=f1e139]: Инъекционные методы
    - heading "Чего можно достичь." [level=2] [ref=f1e140]
    - paragraph [ref=f1e141]: Говорю не о препаратах, а о задачах. Препарат подбирается под задачу, а не наоборот.
    - generic [ref=f1e142]:
      - article [ref=f1e143]:
        - generic [ref=f1e144]: "01."
        - generic [ref=f1e145]:
          - heading "Качество и увлажнённость кожи" [level=3] [ref=f1e146]
          - paragraph [ref=f1e147]: Плотность, сияние, увлажнённость — работа с самой тканью кожи, а не с её объёмами.
      - article [ref=f1e148]:
        - generic [ref=f1e149]: "02."
        - generic [ref=f1e150]:
          - heading "Объёмы и опора тканей" [level=3] [ref=f1e151]
          - paragraph [ref=f1e152]: Восстановление опоры там, где ткани её потеряли — без попытки «слепить» новое лицо.
      - article [ref=f1e153]:
        - generic [ref=f1e154]: "03."
        - generic [ref=f1e155]:
          - heading "Мимические зоны" [level=3] [ref=f1e156]
          - paragraph [ref=f1e157]: Расслабить то, что заламывает кожу, сохранив живую мимику и естественное выражение.
      - article [ref=f1e158]:
        - generic [ref=f1e159]: "04."
        - generic [ref=f1e160]:
          - heading "Асимметрия" [level=3] [ref=f1e161]
          - paragraph [ref=f1e162]: Аккуратное выравнивание врождённых и возрастных асимметрий — работа ювелирная и очень индивидуальная.
    - paragraph [ref=f1e163]:
      - text: Инъекции не заменяют лифтинг, не меняют черты лица и не отменяют ухода —
      - mark [ref=f1e164]: это инструмент, а не волшебство
      - text: .
  - generic [ref=f1e166]:
    - generic [ref=f1e167]: Зоны, которые выдают возраст
    - heading "Лицо ещё держится, а шея выдаёт." [level=2] [ref=f1e168]
    - paragraph [ref=f1e169]: Возраст читается не по лбу и не по носогубным складкам. Первыми выдают шея, зона декольте, кисти рук — и именно им обычно достаётся меньше всего внимания.
    - generic [ref=f1e170]:
      - generic [ref=f1e171]:
        - heading "Шея и кольца Венеры" [level=3] [ref=f1e172]
        - paragraph [ref=f1e173]: Кожа здесь тоньше, сальных желёз меньше, а нагрузки от экранов — больше, поэтому шея стареет раньше лица. Что из этого генетика, а что привычки — видно на осмотре, и от этого зависит план.
      - generic [ref=f1e174]:
        - heading "Второй подбородок" [level=3] [ref=f1e175]
        - paragraph [ref=f1e176]: "Причины разные: лишний объём, слабый тонус тканей, особенности анатомии. Часть случаев решается аппаратами — и я честно говорю, где проходит граница с хирургией."
      - generic [ref=f1e177]:
        - heading "Кисти, локти, колени" [level=3] [ref=f1e178]
        - paragraph [ref=f1e179]: "Зоны, которым достаётся меньше всего ухода. Здесь работает плотность и качество кожи: уплотняющие методики и защита от солнца дают больше, чем любой крем."
  - generic [ref=f1e181]:
    - figure [ref=f1e182]
    - generic [ref=f1e184]:
      - generic [ref=f1e185]: Изнутри
      - heading "Красота начинается не с крема." [level=2] [ref=f1e186]
      - paragraph [ref=f1e187]: "Про это я много пишу у себя в канале: состояние кожи во многом определяется тем, что происходит внутри. Хроническое воспаление, окислительный стресс, состояние кишечника, дефициты, качество сна — всё это отражается на лице раньше, чем мы связываем одно с другим."
      - paragraph [ref=f1e188]: "Я не верю в одну молекулу, которая решит все проблемы. Красивая кожа — это всегда результат комплексной работы: домашнего ухода, процедур по показаниям, питания, образа жизни и здоровья организма в целом."
      - link "Читать статьи" [ref=f1e189] [cursor=pointer]:
        - /url: "#"
  - generic [ref=f1e200]:
    - generic [ref=f1e201]: Домашний уход
    - heading "Я рекомендую." [level=2] [ref=f1e202]
    - generic [ref=f1e203]:
      - generic [ref=f1e204]:
        - paragraph [ref=f1e205]: "Домашний уход иногда решает больше, чем процедуры: он работает каждый день, а не раз в месяц. Но вокруг него столько маркетинга, что разобраться самостоятельно почти невозможно."
        - paragraph [ref=f1e206]: Я подбираю уход под задачу и тип кожи, а не под обещания на упаковке. Чаще всего это марки с дерматологической школой и понятным составом — те, которыми пользуюсь сама и которые советую пациентам на приёме.
