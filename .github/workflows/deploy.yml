name: Deploy

# Любой пуш в main пересобирает сайт и заливает его на SprintHost.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Если два пуша прилетели подряд — выигрывает последний: иначе два
  # недокатанных rsync гонятся друг с другом и портят живой сайт.
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npx astro build

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to SprintHost
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          PORT: ${{ secrets.SSH_PORT || '22' }}
          TARGET: ${{ secrets.DEPLOY_PATH }}
        run: |
          # ssh-keyscan здесь НЕ используем намеренно: это лишнее соединение
          # с сервером, который придерживает частые подключения, а падало оно
          # раньше самого rsync — шаг идёт под `bash -e` и умирал до попыток.
          # Ключ хоста принимает сам ssh через StrictHostKeyChecking=accept-new.
          #
          # Слеш в конце локального пути обязателен: копируется содержимое
          # dist, а не сама папка. --delete убирает на хостинге то, чего
          # больше нет в сборке.
          #
          # Паузы нарастают (1, 2, 3 минуты): блокировка по IP раннера
          # снимается сама, но не всегда за минуту.
          for attempt in 1 2 3; do
            if rsync -az --delete \
                 -e "ssh -p $PORT -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30" \
                 dist/ "$USER@$HOST:$TARGET"; then
              echo "rsync прошёл с попытки $attempt"
              exit 0
            fi
            if [ "$attempt" = 3 ]; then break; fi
            echo "Попытка $attempt не удалась, ждём $((attempt * 60)) секунд"
            sleep $((attempt * 60))
          done
          echo "Все три попытки rsync провалились"
          exit 1
