name: Deploy

# Любой пуш в main пересобирает сайт и заливает его на SprintHost.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Если два пуша прилетели подряд — выигрывает последний: иначе два
  # недокатанных rsync гонятся друг с другом и портят живой сайт.
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npx astro build

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to SprintHost
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          PORT: ${{ secrets.SSH_PORT || '22' }}
          TARGET: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Только ed25519: без -t keyscan опрашивает сервер пять раз подряд,
          # и хостинг считает это флудом — следом идущий rsync получает
          # «Connection closed by host» ещё до передачи данных.
          ssh-keyscan -t ed25519 -p "$PORT" "$HOST" >> ~/.ssh/known_hosts
          # Слеш в конце локального пути обязателен: копируется содержимое
          # dist, а не сама папка. --delete убирает на хостинге то, чего
          # больше нет в сборке.
          # Три попытки с паузой: если сервер всё же придержал IP раннера,
          # блокировка снимается через минуту-другую сама.
          for attempt in 1 2 3; do
            if rsync -az --delete \
                 -e "ssh -p $PORT -o StrictHostKeyChecking=accept-new" \
                 dist/ "$USER@$HOST:$TARGET"; then
              echo "rsync прошёл с попытки $attempt"
              exit 0
            fi
            echo "Попытка $attempt не удалась, ждём 60 секунд"
            sleep 60
          done
          echo "Все три попытки rsync провалились"
          exit 1
